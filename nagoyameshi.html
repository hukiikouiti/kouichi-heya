
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名古屋めし防衛ゲーム</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #222;
            margin: 20px auto;
            border: 4px solid #d4af37;
            overflow: hidden;
        }
        /* UI表示 */
        #ui {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.8);
            width: 400px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        /* 血糖値メーター */
        #meter-container {
            width: 400px;
            margin: 5px auto;
            background: #444;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-sizing: border-box;
            border: 2px solid #666;
        }
        #meter-bar {
            width: 0%;
            height: 100%;
            background: #ff4757;
            transition: width 0.3s;
        }
        /* キャラクター共通スタイル */
        .entity {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>
<body>

    <div id="ui">
        <span id="time-display">残り: 60秒</span>
        <span id="score-display">残り標的: 4個</span>
    </div>
    <div style="width: 400px; margin: 0 auto; font-size: 14px; color: #ff4757; font-weight: bold;">血糖値メーター</div>
    <div id="meter-container">
        <div id="meter-bar"></div>
    </div>

    <div id="game-container"></div>

    <script>
        const container = document.getElementById('game-container');
        const timeDisplay = document.getElementById('time-display');
        const scoreDisplay = document.getElementById('score-display');
        const meterBar = document.getElementById('meter-bar');

        // ゲーム変数
        let timeLeft = 60;
        let isGameOver = false;
        let isCleared = false;
        let score = 0; // 倒した数
        let sugarLevel = 0; // 血糖値 %

        // 自機（名古屋城）
        let castleX = 175;
        const castle = document.createElement('div');
        castle.className = 'entity';
        castle.style.width = '50px';
        castle.style.height = '50px';
        castle.style.backgroundImage = "url('nagoyajyuu.png')";
        castle.style.bottom = '20px';
        castle.style.left = castleX + 'px';
        container.appendChild(castle);

        // 玉・敵・敵の弾の配列
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];

        // 敵（名古屋めし4種類）のファイル名
        const enemyImages = ['hitsumabushi.png', 'miso-katsu.png', 'miso-nikomi.png', 'tebasaki.png'];
        
        // 敵を横一列に4個配置
        enemyImages.forEach((img, index) => {
            let enemy = {
                x: 20 + index * 90,
                y: 50,
                width: 70,
                height: 70,
                hp: 10, // 10発で倒せる
                maxHp: 10,
                element: document.createElement('div'),
                image: img
            };
            enemy.element.className = 'entity';
            enemy.element.style.width = enemy.width + 'px';
            enemy.element.style.height = enemy.height + 'px';
            enemy.element.style.backgroundImage = `url('${enemy.image}')`;
            enemy.element.style.left = enemy.x + 'px';
            enemy.element.style.top = enemy.y + 'px';
            container.appendChild(enemy.element);
            enemies.push(enemy);
        });

        // キーボード操作（左右移動 ＆ スペースで弾発射）
        let keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'ArrowUp') {
                shootBullet();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // スマホ・マウス操作（画面タッチ／クリックで左右移動＆自動連射）
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            castleX = e.clientX - rect.left - 25;
            if (castleX < 0) castleX = 0;
            if (castleX > 350) castleX = 350;
        });
        container.addEventListener('click', () => {
            shootBullet();
        });

        // 弾を早く発射する仕組み
        function shootBullet() {
            if (isGameOver || isCleared) return;
            let bullet = document.createElement('div');
            bullet.className = 'entity';
            bullet.style.width = '6px';
            bullet.style.height = '15px';
            bullet.style.backgroundColor = '#d4af37';
            bullet.style.borderRadius = '3px';
            let bx = castleX + 22;
            let by = 530;
            bullet.style.left = bx + 'px';
            bullet.style.top = by + 'px';
            container.appendChild(bullet);
            bullets.push({ x: bx, y: by, element: bullet });
        }

        // 敵が玉を落としてくる処理
        function enemyShoot(enemy) {
            if (isGameOver || isCleared) return;
            let eb = document.createElement('div');
            eb.className = 'entity';
            eb.style.width = '8px';
            eb.style.height = '12px';
            eb.style.backgroundColor = '#ff4757';
            eb.style.borderRadius = '4px';
            let ex = enemy.x + enemy.width / 2 - 4;
            let ey = enemy.y + enemy.height;
            eb.style.left = ex + 'px';
            eb.style.top = ey + 'px';
            container.appendChild(eb);
            enemyBullets.push({ x: ex, y: ey, element: eb });
        }

        // 定期的に敵が弾を落とす
        setInterval(() => {
            if (isGameOver || isCleared) return;
            enemies.forEach(enemy => {
                if (enemy.hp > 0 && Math.random() < 0.4) {
                    enemyShoot(enemy);
                }
            });
        }, 800);

        // 制限時間タイマー（60秒で終了）
        let timer = setInterval(() => {
            if (isGameOver || isCleared) return;
            timeLeft--;
            timeDisplay.innerText = `残り: ${timeLeft}秒`;
            if (timeLeft <= 0) {
                gameOver("時間切れです…！");
            }
        }, 1000);

        // ゲームのメインループ
        function update() {
            if (isGameOver || isCleared) return;

            // 自機の移動
            if (keys['ArrowLeft'] || keys['a']) castleX -= 6;
            if (keys['ArrowRight'] || keys['d']) castleX += 6;
            if (castleX < 0) castleX = 0;
            if (castleX > 350) castleX = 350;
            castle.style.left = castleX + 'px';

            // 自機の弾の移動
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= 10; // 弾のスピード
                b.element.style.top = b.y + 'px';

                // 画面外に出たら消す
                if (b.y < 0) {
                    b.element.remove();
                    bullets.splice(i, 1);
                    continue;
                }

                // 敵との当たり判定
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (en.hp > 0 &&
                        b.x > en.x && b.x < en.x + en.width &&
                        b.y > en.y && b.y < en.y + en.height) {
                        
                        // 当たった！
                        b.element.remove();
                        bullets.splice(i, 1);

                        en.hp--;
                        // ダメージ演出（点滅などのかわりに少し縮小など）
                        en.element.style.opacity = (en.hp / en.maxHp);

                        if (en.hp <= 0) {
                            en.element.remove();
                            score++;
                            sugarLevel += 25; // 1体倒すごとに血糖値25%上昇
                            meterBar.style.width = sugarLevel + '%';
                            scoreDisplay.innerText = `残り標的: ${4 - score}個`;

                            if (score >= 4) {
                                gameClear();
                            }
                        }
                        break;
                    }
                }
            }

            // 敵の弾の移動と自機との当たり判定
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.y += 4; // 敵の弾のスピード
                eb.element.style.top = eb.y + 'px';

                // 画面外
                if (eb.y > 600) {
                    eb.element.remove();
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // 自機（名古屋城）との当たり判定
                if (eb.x > castleX && eb.x < castleX + 50 &&
                    eb.y > 530 && eb.y < 580) {
                    gameOver("血糖値オーバー（被弾）！ゲームオーバー");
                    break;
                }
            }

            requestAnimationFrame(update);
        }

        function gameOver(msg) {
            isGameOver = true;
            clearInterval(timer);
            // ゲームオーバー時にLINEや予約ボタン画面へ移動する（例として予約ページやLINEへ飛ばすか、アラートを出して移動）
            alert(msg + "\n予約・公式LINE画面へ移動します。");
            // ※必要に応じて実際の予約ページURLやLINEのURLに変更してください
            window.location.href = "https://line.me"; // ←ここに設定した予約ページやLINEのリンクが開きます
        }

        function gameClear() {
            isCleared = true;
            clearInterval(timer);
            setTimeout(() => {
                alert("おめでとうございます！名古屋めしを制覇しました（クリア！）");
            }, 200);
        }

        // ゲームスタート
        update();
    </script>
</body>
</html>
