<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名古屋めし防衛戦 | 皓一部屋</title>
<style>
    body {
        margin: 0;
        background: #111;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
    }
    .game-card {
        background: #222;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        border: 4px solid #d4af37;
        max-width: 440px;
        width: 100%;
        box-sizing: border-box;
    }
    h1 {
        font-size: 1.1rem;
        color: #d4af37;
        margin-top: 0;
        margin-bottom: 10px;
    }
    #game-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        height: 500px;
        background: #1a1a1a;
        margin: 0 auto 10px auto;
        border: 2px solid #555;
        overflow: hidden;
        border-radius: 8px;
    }
    #ui {
        display: flex;
        justify-content: space-between;
        padding: 8px 12px;
        font-size: 14px;
        font-weight: bold;
        background: rgba(0,0,0,0.8);
        color: #fff;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        box-sizing: border-box;
        border-radius: 8px 8px 0 0;
    }
    #meter-container {
        width: 100%;
        max-width: 400px;
        margin: 0 auto 10px auto;
        background: #444;
        height: 16px;
        border-radius: 0 0 8px 8px;
        overflow: hidden;
        box-sizing: border-box;
        border: 2px solid #666;
        border-top: none;
    }
    #meter-bar {
        width: 0%;
        height: 100%;
        background: #ff4757;
        transition: width 0.3s;
    }
    .entity {
        position: absolute;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
    }
    .btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 10px;
    }
    .action-btn {
        padding: 8px 16px;
        background: #444;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        text-decoration: none;
    }
    .action-btn:hover {
        background: #555;
    }
</style>
</head>
<body>

<div class="game-card">
    <h1>🏰 名古屋めし防衛戦</h1>
    <div id="ui">
        <span id="time-display">残り: 60秒</span>
        <span id="score-display">残り標的: 4個</span>
    </div>
    <div style="width: 100%; max-width: 400px; margin: 0 auto; font-size: 12px; color: #ff4757; font-weight: bold;">血糖値メーター</div>
    <div id="meter-container">
        <div id="meter-bar"></div>
    </div>
    <div id="game-container"></div>
    
    <div class="btn-group">
        <button class="action-btn" onclick="location.reload()">もう一度プレイ</button>
        <a href="nagoyameshi.html" class="action-btn">メニューに戻る</a>
    </div>
</div>

<script>
    const container = document.getElementById('game-container');
    const timeDisplay = document.getElementById('time-display');
    const scoreDisplay = document.getElementById('score-display');
    const meterBar = document.getElementById('meter-bar');

    let timeLeft = 60;
    let isGameOver = false;
    let isCleared = false;
    let score = 0;
    let sugarLevel = 0;

    let castleX = 175;
    const castle = document.createElement('div');
    castle.className = 'entity';
    castle.style.width = '45px';
    castle.style.height = '45px';
    castle.style.backgroundImage = "url('nagoyajyuu.png')";
    castle.style.bottom = '15px';
    castle.style.left = castleX + 'px';
    container.appendChild(castle);

    let bullets = [];
    let enemies = [];
    let enemyBullets = [];

    const enemyImages = ['hitsumabushi.png', 'miso-katsu.png', 'miso-nikomi.png', 'tebasaki.png'];
    
    enemyImages.forEach((img, index) => {
        let enemy = {
            x: 15 + index * 92,
            y: 30,
            width: 65,
            height: 65,
            hp: 10,
            maxHp: 10,
            element: document.createElement('div'),
            image: img
        };
        enemy.element.className = 'entity';
        enemy.element.style.width = enemy.width + 'px';
        enemy.element.style.height = enemy.height + 'px';
        enemy.element.style.backgroundImage = `url('${enemy.image}')`;
        enemy.element.style.left = enemy.x + 'px';
        enemy.element.style.top = enemy.y + 'px';
        container.appendChild(enemy.element);
        enemies.push(enemy);
    });

    let keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (e.key === ' ' || e.key === 'ArrowUp') {
            shootBullet();
        }
    });
    window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
    });

    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        castleX = e.clientX - rect.left - 22;
        if (castleX < 0) castleX = 0;
        if (castleX > 355) castleX = 355;
    });
    container.addEventListener('touchmove', (e) => {
        const rect = container.getBoundingClientRect();
        castleX = e.touches[0].clientX - rect.left - 22;
        if (castleX < 0) castleX = 0;
        if (castleX > 355) castleX = 355;
    });
    container.addEventListener('click', () => {
        shootBullet();
    });

    function shootBullet() {
        if (isGameOver || isCleared) return;
        let bullet = document.createElement('div');
        bullet.className = 'entity';
        bullet.style.width = '6px';
        bullet.style.height = '14px';
        bullet.style.backgroundColor = '#d4af37';
        bullet.style.borderRadius = '3px';
        let bx = castleX + 19;
        let by = 440;
        bullet.style.left = bx + 'px';
        bullet.style.top = by + 'px';
        container.appendChild(bullet);
        bullets.push({ x: bx, y: by, element: bullet });
    }

    function enemyShoot(enemy) {
        if (isGameOver || isCleared) return;
        let eb = document.createElement('div');
        eb.className = 'entity';
        eb.style.width = '7px';
        eb.style.height = '11px';
        eb.style.backgroundColor = '#ff4757';
        eb.style.borderRadius = '3px';
        let ex = enemy.x + enemy.width / 2 - 3;
        let ey = enemy.y + enemy.height;
        eb.style.left = ex + 'px';
        eb.style.top = ey + 'px';
        container.appendChild(eb);
        enemyBullets.push({ x: ex, y: ey, element: eb });
    }

    setInterval(() => {
        if (isGameOver || isCleared) return;
        enemies.forEach(enemy => {
            if (enemy.hp > 0 && Math.random() < 0.45) {
                enemyShoot(enemy);
            }
        });
    }, 750);

    let timer = setInterval(() => {
        if (isGameOver || isCleared) return;
        timeLeft--;
        timeDisplay.innerText = `残り: ${timeLeft}秒`;
        if (timeLeft <= 0) {
            gameOver("時間切れです…！");
        }
    }, 1000);

    function update() {
        if (isGameOver || isCleared) return;

        if (keys['ArrowLeft'] || keys['a']) castleX -= 6;
        if (keys['ArrowRight'] || keys['d']) castleX += 6;
        if (castleX < 0) castleX = 0;
        if (castleX > 355) castleX = 355;
        castle.style.left = castleX + 'px';

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= 11;
            b.element.style.top = b.y + 'px';

            if (b.y < 0) {
                b.element.remove();
                bullets.splice(i, 1);
                continue;
            }

            for (let j = enemies.length - 1; j >= 0; j--) {
                let en = enemies[j];
                if (en.hp > 0 &&
                    b.x > en.x && b.x < en.x + en.width &&
                    b.y > en.y && b.y < en.y + en.height) {
                    
                    b.element.remove();
                    bullets.splice(i, 1);

                    en.hp--;
                    en.element.style.opacity = (en.hp / en.maxHp);

                    if (en.hp <= 0) {
                        en.element.remove();
                        score++;
                        sugarLevel += 25;
                        meterBar.style.width = sugarLevel + '%';
                        scoreDisplay.innerText = `残り標的: ${4 - score}個`;

                        if (score >= 4) {
                            gameClear();
                        }
                    }
                    break;
                }
            }
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let eb = enemyBullets[i];
            eb.y += 4.5;
            eb.element.style.top = eb.y + 'px';

            if (eb.y > 500) {
                eb.element.remove();
                enemyBullets.splice(i, 1);
                continue;
            }

            if (eb.x > castleX && eb.x < castleX + 45 &&
                eb.y > 440 && eb.y < 485) {
                gameOver("血糖値オーバー（被弾）！ゲームオーバー");
                break;
            }
        }

        requestAnimationFrame(update);
    }

    function gameOver(msg) {
        isGameOver = true;
        clearInterval(timer);
        alert(msg + "\n公式LINE・予約画面へ移動します。");
        window.location.href = "https://line.me"; // ←必要に応じて予約ページやLINEのURLに変更できます
    }

    function gameClear() {
        isCleared = true;
        clearInterval(timer);
        setTimeout(() => {
            alert("おめでとうございます！名古屋めしをすべて制覇しました（クリア！）");
        }, 200);
    }

    update();
</script>

</body>
</html>
