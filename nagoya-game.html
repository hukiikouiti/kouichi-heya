<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名古屋めし防衛戦 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #b8860b;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #d4af37;
        }
        /* メーター */
        #meter-container {
            width: 100%;
            background: #444;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            box-sizing: border-box;
            border: 2px solid #666;
            margin-bottom: 10px;
        }
        #meter-bar {
            width: 0%;
            height: 100%;
            background: #ff4757;
            transition: width 0.3s;
        }
        /* ゲームステージ */
        .game-stage {
            width: 100%;
            height: 340px;
            background: #1a1a1a;
            border: 3px solid #d4af37;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 12px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
            touch-action: none;
        }
        .entity {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* ポップアップ文字 */
        .popup-msg {
            position: absolute;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
            z-index: 10;
        }
        .popup-plus { color: #fff; background: rgba(212, 175, 55, 0.9); border: 1px solid #ffcc00; }
        .popup-miss { color: #fff; background: rgba(192, 57, 43, 0.9); border: 1px solid #ff9999; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-35px) scale(1.1); }
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .start-btn {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff;
            border-radius: 30px;
            font-size: 1.05rem;
            padding: 15px 0;
        }
        .share-btn {
            background-color: #000000;
            color: #fff;
        }
        .line-btn {
            background: linear-gradient(135deg, #06c755, #05b34c);
            color: #fff;
        }
        .reserve-btn {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: #fff;
        }
        .hidden {
            display: none !important;
        }
        .back-link {
            display: block;
            margin-top: 12px;
            color: #3498db;
            font-size: 0.85rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🏰 名古屋めし防衛戦</h1>
    <p>名古屋城を動かして（または画面タップで）、迫り来る名古屋めしを撃ち落とせ！敵の弾に当たると血糖値オーバーでゲームオーバー！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">🏯✨</div>
        <button id="start-btn" class="btn start-btn">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">60</span>秒</div>
            <div>残り標的: <span id="score-count">4</span>個</div>
        </div>
        <div style="font-size: 0.8rem; color: #ff4757; font-weight: bold; margin-bottom: 2px;">血糖値メーター (<span id="sugar-text">0</span>%)</div>
        <div id="meter-container">
            <div id="meter-bar"></div>
        </div>
        
        <!-- ゲームステージ -->
        <div class="game-stage" id="game-stage"></div>
        <p style="font-size: 0.75rem; color: #888;">左右キー / 画面スワイプ / タップで攻撃！</p>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #b8860b; font-size: 1.2rem;">✨ バトル終了！</h2>
        <div id="result-message" style="font-size: 0.95rem; margin: 15px 0; color: #333; line-height: 1.6;"></div>

        <!-- 1列目：LINEお友達追加 -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" rel="noopener noreferrer" class="game-link-btn line-btn">🟢 LINEお友達追加</a>

        <!-- 2列目：予約する -->
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" rel="noopener noreferrer" class="game-link-btn reserve-btn">📅 予約する（空き状況確認・ご予約）</a>

        <!-- 3列目：Xで結果をシェア -->
        <a id="share-link" href="#" target="_blank" rel="noopener noreferrer" class="game-link-btn share-btn">𝕏 で結果をシェアする</a>

        <!-- 4列目：もう一度あそぶ ＆ ゲーム選択に戻る -->
        <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 10px; box-sizing: border-box;">
            <button onclick="startGame()" style="background: #3498db; color: #fff; flex: 1; padding: 12px 10px; border-radius: 14px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.9rem;">もう一度あそぶ</button>
            <a href="nagoyameshi.html" style="background: #95a5a6; color: #fff; flex: 1; padding: 12px 10px; border-radius: 14px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.9rem;">ゲーム選択に戻る</a>
        </div>

        <!-- 5列目：トップに戻る -->
        <a href="index.html" class="game-link-btn" style="background: #7f8c8d; color: #fff; width: 100%; padding: 12px 20px; box-sizing: border-box; text-decoration: none; font-size: 0.9rem;">🏠 トップに戻る</a>
    </div>

    <a href="nagoyameshi.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<script>
    let timeLeft = 60;
    let isPlaying = false;
    let score = 0; // 倒した数
    let sugarLevel = 0;
    let timerInterval = null;
    let loopInterval = null;
    let enemyShootInterval = null;

    let castleX = 160;
    const castleWidth = 65;
    const castleHeight = 65;
    let castle, castleElem;
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let keys = {};

    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                startGame();
            });
        }

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if ((e.key === ' ' || e.key === 'ArrowUp') && isPlaying) {
                shootBullet();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
    });

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        timeLeft = 60;
        score = 0;
        sugarLevel = 0;
        castleX = 160;
        bullets = [];
        enemies = [];
        enemyBullets = [];

        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('score-count').innerText = "4";
        document.getElementById('sugar-text').innerText = "0";
        document.getElementById('meter-bar').style.width = "0%";

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';

        // 自機（名古屋城）配置
        castleElem = document.createElement('div');
        castleElem.className = 'entity';
        castleElem.style.width = castleWidth + 'px';
        castleElem.style.height = castleHeight + 'px';
        castleElem.style.backgroundImage = "url('nagoyajyuu.png')";
        castleElem.style.bottom = '10px';
        castleElem.style.left = castleX + 'px';
        stage.appendChild(castleElem);

        // 敵（名古屋めし4種類）配置
        const enemyImages = ['hitsumabushi.png', 'miso-katsu.png', 'miso-nikomi.png', 'tebasaki.png'];
        enemyImages.forEach((img, index) => {
            let enemy = {
                x: 8 + index * 95,
                y: 15,
                width: 75,
                height: 75,
                hp: 10,
                maxHp: 10,
                element: document.createElement('div'),
                image: img
            };
            enemy.element.className = 'entity';
            enemy.element.style.width = enemy.width + 'px';
            enemy.element.style.height = enemy.height + 'px';
            enemy.element.style.backgroundImage = `url('${enemy.image}')`;
            enemy.element.style.left = enemy.x + 'px';
            enemy.element.style.top = enemy.y + 'px';
            stage.appendChild(enemy.element);
            enemies.push(enemy);
        });

        // マウス・タッチ操作
        stage.onmousemove = (e) => {
            const rect = stage.getBoundingClientRect();
            castleX = e.clientX - rect.left - (castleWidth / 2);
            if (castleX < 0) castleX = 0;
            if (castleX > stage.clientWidth - castleWidth) castleX = stage.clientWidth - castleWidth;
        };
        stage.ontouchmove = (e) => {
            const rect = stage.getBoundingClientRect();
            castleX = e.touches[0].clientX - rect.left - (castleWidth / 2);
            if (castleX < 0) castleX = 0;
            if (castleX > stage.clientWidth - castleWidth) castleX = stage.clientWidth - castleWidth;
        };
        stage.onclick = () => {
            if (isPlaying) shootBullet();
        };

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'nagoya_game'});
        }

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame(false, "時間切れです…！");
            }
        }, 1000);

        if (enemyShootInterval) clearInterval(enemyShootInterval);
        enemyShootInterval = setInterval(() => {
            if (!isPlaying) return;
            enemies.forEach(enemy => {
                if (enemy.hp > 0 && Math.random() < 0.4) {
                    enemyShoot(enemy);
                }
            });
        }, 850);

        if (loopInterval) cancelAnimationFrame(loopInterval);
        gameLoop();
    }

    function shootBullet() {
        const stage = document.getElementById('game-stage');
        let bullet = document.createElement('div');
        bullet.className = 'entity';
        bullet.style.width = '6px';
        bullet.style.height = '14px';
        bullet.style.backgroundColor = '#d4af37';
        bullet.style.borderRadius = '3px';
        let bx = castleX + (castleWidth / 2) - 3;
        let by = stage.clientHeight - castleHeight - 20;
        bullet.style.left = bx + 'px';
        bullet.style.top = by + 'px';
        stage.appendChild(bullet);
        bullets.push({ x: bx, y: by, element: bullet });
    }

    function enemyShoot(enemy) {
        const stage = document.getElementById('game-stage');
        let eb = document.createElement('div');
        eb.className = 'entity';
        eb.style.width = '8px';
        eb.style.height = '12px';
        eb.style.backgroundColor = '#ff4757';
        eb.style.borderRadius = '3px';
        let ex = enemy.x + enemy.width / 2 - 4;
        let ey = enemy.y + enemy.height;
        eb.style.left = ex + 'px';
        eb.style.top = ey + 'px';
        stage.appendChild(eb);
        
        let randomSpeed = 1.5 + Math.random() * 1.5;
        enemyBullets.push({ x: ex, y: ey, speed: randomSpeed, element: eb });
    }

    function gameLoop() {
        if (!isPlaying) return;
        const stage = document.getElementById('game-stage');

        if (keys['ArrowLeft'] || keys['a']) castleX -= 6;
        if (keys['ArrowRight'] || keys['d']) castleX += 6;
        if (castleX < 0) castleX = 0;
        if (castleX > stage.clientWidth - castleWidth) castleX = stage.clientWidth - castleWidth;
        castleElem.style.left = castleX + 'px';

        // 自機の弾移動
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= 11;
            b.element.style.top = b.y + 'px';

            if (b.y < 0) {
                b.element.remove();
                bullets.splice(i, 1);
                continue;
            }

            for (let j = enemies.length - 1; j >= 0; j--) {
                let en = enemies[j];
                if (en.hp > 0 &&
                    b.x > en.x && b.x < en.x + en.width &&
                    b.y > en.y && b.y < en.y + en.height) {
                    
                    b.element.remove();
                    bullets.splice(i, 1);

                    en.hp--;
                    en.element.style.opacity = (en.hp / en.maxHp);

                    if (en.hp <= 0) {
                        en.element.remove();
                        score++;
                        sugarLevel += 25;
                        document.getElementById('sugar-text').innerText = sugarLevel;
                        document.getElementById('meter-bar').style.width = sugarLevel + '%';
                        document.getElementById('score-count').innerText = 4 - score;

                        if (score >= 4) {
                            endGame(true, "おめでとうございます！名古屋めしをすべて制覇しました！");
                            return;
                        }
                    }
                    break;
                }
            }
        }

        // 敵の弾移動
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let eb = enemyBullets[i];
            eb.y += eb.speed;
            eb.element.style.top = eb.y + 'px';

            if (eb.y > stage.clientHeight) {
                eb.element.remove();
                enemyBullets.splice(i, 1);
                continue;
            }

            // 当たり判定（名古屋城に被弾）
            if (eb.x > castleX && eb.x < castleX + castleWidth &&
                eb.y > stage.clientHeight - castleHeight - 15 && eb.y < stage.clientHeight) {
                endGame(false, "血糖値オーバー（被弾）！ゲームオーバー");
                return;
            }
        }

        loopInterval = requestAnimationFrame(gameLoop);
    }

    function endGame(isClear, message) {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        clearInterval(enemyShootInterval);
        cancelAnimationFrame(loopInterval);

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let titleText = isClear ? "✨ 大勝利（クリア）！" : "💥 血糖値オーバー！";
        document.getElementById('result-title').innerText = titleText;
        document.getElementById('result-message').innerHTML = '<div style="font-size:2.5rem; margin:5px 0;">' + (isClear ? '🏯🎉' : '🍩⚠️') + '</div>' + message + '<br><br>倒した名古屋めし： <b>'+ score +' / 4 個</b><br>最終血糖値： <b>'+ sugarLevel +'%</b>';

        var shareText = encodeURIComponent('名古屋めし防衛戦で名古屋めしを ' + score + ' 個討伐！最終血糖値 ' + sugarLevel + '% でした！\nあなたも名古屋城を守り抜こう！👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodeURIComponent(window.location.href) + '&hashtags=皓一部屋,名古屋めし,健康防衛軍';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'nagoya_game', 'score': score, 'clear': isClear});
        }
    }
</script>

</body>
</html>
