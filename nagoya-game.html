<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>名古屋めし防衛戦 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 15px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 100%;
            width: 380px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: #b8860b;
        }
        p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #d4af37;
        }
        /* メーター */
        #meter-container {
            width: 100%;
            background: #444;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            box-sizing: border-box;
            border: 2px solid #666;
            margin-bottom: 8px;
        }
        #meter-bar {
            width: 0%;
            height: 100%;
            background: #ff4757;
            transition: width 0.3s;
        }
        /* ゲームステージ（スマホ幅に完全フィット） */
        .game-stage {
            width: 100%;
            height: 320px;
            background: #1a1a1a;
            border: 3px solid #d4af37;
            border-radius: 14px;
            position: relative;
            margin: 0 auto 10px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        .entity {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* 被弾時の点滅アニメーション用 */
        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        .hit-flash {
            animation: flash 0.4s ease;
        }

        /* 画面下の操作ボタンパネル */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 8px;
            gap: 8px;
            box-sizing: border-box;
        }
        .ctrl-btn {
            background: #34495e;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 0;
            flex: 1;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }
        .ctrl-btn:active {
            background: #2c3e50;
            transform: scale(0.96);
        }
        /* 丸い発射ボタン */
        .fire-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            flex: 0 0 60px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
        }
        .fire-btn:active {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: scale(0.92);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .start-btn {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff;
            border-radius: 30px;
            font-size: 1.05rem;
            padding: 15px 0;
        }
        .share-btn {
            background-color: #000000;
            color: #fff;
        }
        .line-btn {
            background: linear-gradient(135deg, #06c755, #05b34c);
            color: #fff;
        }
        .reserve-btn {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: #fff;
        }
        .hidden {
            display: none !important;
        }
        .back-link {
            display: block;
            margin-top: 10px;
            color: #3498db;
            font-size: 0.8rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🏰 名古屋めし防衛戦</h1>
    <p>下のボタン（◀ ▶）で城を動かし、丸い発射ボタン（FIRE）で弾を出そう！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3rem; margin: 10px 0;">🏯✨</div>
        <button id="start-btn" class="btn start-btn">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り: <span id="timer">60</span>秒</div>
            <div>残り標的: <span id="score-count">4</span>個</div>
        </div>
        <div style="font-size: 0.75rem; color: #ff4757; font-weight: bold; margin-bottom: 2px;">血糖値メーター (<span id="sugar-text">0</span>%)</div>
        <div id="meter-container">
            <div id="meter-bar"></div>
        </div>
        
        <!-- ゲームステージ -->
        <div class="game-stage" id="game-stage"></div>

        <!-- 画面下の操作ボタンパネル -->
        <div class="controls">
            <button class="ctrl-btn" id="left-btn">◀ 移動</button>
            <button class="ctrl-btn fire-btn" id="fire-btn">🔥発射</button>
            <button class="ctrl-btn" id="right-btn">移動 ▶</button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #b8860b; font-size: 1.1rem;">✨ バトル終了！</h2>
        <div id="result-message" style="font-size: 0.9rem; margin: 12px 0; color: #333; line-height: 1.5;"></div>

            <!-- 5列目：トップに戻る -->
        <a href="index.html" class="game-link-btn" style="background: #7f8c8d; color: #fff; width: 100%; padding: 12px 15px; box-sizing: border-box; text-decoration: none; font-size: 0.85rem;">🏠 トップに戻る</a>
    </div>
      
        <!-- 2列目：予約する -->
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" rel="noopener noreferrer" class="game-link-btn reserve-btn">📅 予約する（空き状況確認・ご予約）</a>

        <!-- 3列目：Xで結果をシェア -->
        <a id="share-link" href="#" target="_blank" rel="noopener noreferrer" class="game-link-btn share-btn">𝕏 で結果をシェアする</a>

        <!-- 4列目：もう一度あそぶ ＆ ゲーム選択に戻る -->
        <div style="display: flex; gap: 8px; width: 100%; margin-bottom: 8px; box-sizing: border-box;">
            <button onclick="startGame()" style="background: #3498db; color: #fff; flex: 1; padding: 12px 8px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 0.85rem;">もう一度あそぶ</button>
            <a href="nagoyameshi.html" style="background: #95a5a6; color: #fff; flex: 1; padding: 12px 8px; border-radius: 12px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">ゲーム選択に戻る</a>
        </div>

          <!-- 1列目：LINEお友達追加 -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" rel="noopener noreferrer" class="game-link-btn line-btn">🟢 LINEお友達追加</a>

    

    <a href="nagoyameshi.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<script>
    let timeLeft = 60;
    let isPlaying = false;
    let score = 0;
    let sugarLevel = 0;
    let timerInterval = null;
    let loopInterval = null;
    let enemyShootInterval = null;
    let hitCooldown = false;

    let castleX = 140;
    const castleWidth = 55;
    const castleHeight = 55;
    let castleElem, stageElem;
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let keys = {};
    let movingLeft = false;
    let movingRight = false;

    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                startGame();
            });
        }

        // キーボード操作対応
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if ((e.key === ' ' || e.key === 'ArrowUp') && isPlaying) {
                shootBullet();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // 画面下ボタンのタッチ・マウスイベント設定
        setupButtonControls('left-btn', () => { movingLeft = true; }, () => { movingLeft = false; });
        setupButtonControls('right-btn', () => { movingRight = true; }, () => { movingRight = false; });
        
        const fireBtn = document.getElementById('fire-btn');
        fireBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (isPlaying) shootBullet();
        });
    });

    function setupButtonControls(id, onStart, onEnd) {
        const btn = document.getElementById(id);
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); onStart(); });
        btn.addEventListener('pointerup', (e) => { e.preventDefault(); onEnd(); });
        btn.addEventListener('pointerleave', (e) => { e.preventDefault(); onEnd(); });
    }

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        timeLeft = 60;
        score = 0;
        sugarLevel = 0;
        castleX = 140;
        bullets = [];
        enemies = [];
        enemyBullets = [];
        hitCooldown = false;
        movingLeft = false;
        movingRight = false;

        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('score-count').innerText = "4";
        document.getElementById('sugar-text').innerText = "0";
        document.getElementById('meter-bar').style.width = "0%";

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        stageElem = document.getElementById('game-stage');
        stageElem.innerHTML = '';

        // 自機（名古屋城）配置
        castleElem = document.createElement('div');
        castleElem.className = 'entity';
        castleElem.style.width = castleWidth + 'px';
        castleElem.style.height = castleHeight + 'px';
        castleElem.style.backgroundImage = "url('nagoyajyuu.png')";
        castleElem.style.bottom = '10px';
        castleElem.style.left = castleX + 'px';
        stageElem.appendChild(castleElem);

        // 敵（名古屋めし4種類）配置
        const enemyImages = ['hitsumabushi.png', 'miso-katsu.png', 'miso-nikomi.png', 'tebasaki.png'];
        const stageWidth = stageElem.clientWidth || 320;
        const spacing = stageWidth / 4;

        enemyImages.forEach((img, index) => {
            let enemy = {
                x: 10 + index * (spacing - 5),
                y: 12,
                width: 60,
                height: 60,
                hp: 10,
                maxHp: 10,
                element: document.createElement('div'),
                image: img
            };
            enemy.element.className = 'entity';
            enemy.element.style.width = enemy.width + 'px';
            enemy.element.style.height = enemy.height + 'px';
            enemy.element.style.backgroundImage = `url('${enemy.image}')`;
            enemy.element.style.left = enemy.x + 'px';
            enemy.element.style.top = enemy.y + 'px';
            stageElem.appendChild(enemy.element);
            enemies.push(enemy);
        });

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'nagoya_game'});
        }

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame(false, "時間切れです…！");
            }
        }, 1000);

        // 敵の弾の頻度をさらにゆっくり（1.2秒おきに判定）
        if (enemyShootInterval) clearInterval(enemyShootInterval);
        enemyShootInterval = setInterval(() => {
            if (!isPlaying) return;
            enemies.forEach(enemy => {
                if (enemy.hp > 0 && Math.random() < 0.28) {
                    enemyShoot(enemy);
                }
            });
        }, 1100);

        if (loopInterval) cancelAnimationFrame(loopInterval);
        gameLoop();
    }

    function shootBullet() {
        let bullet = document.createElement('div');
        bullet.className = 'entity';
        bullet.style.width = '5px';
        bullet.style.height = '12px';
        bullet.style.backgroundColor = '#d4af37';
        bullet.style.borderRadius = '3px';
        let bx = castleX + (castleWidth / 2) - 2;
        let by = stageElem.clientHeight - castleHeight - 15;
        bullet.style.left = bx + 'px';
        bullet.style.top = by + 'px';
        stageElem.appendChild(bullet);
        bullets.push({ x: bx, y: by, element: bullet });
    }

    function enemyShoot(enemy) {
        let eb = document.createElement('div');
        eb.className = 'entity';
        eb.style.width = '8px';
        eb.style.height = '12px';
        eb.style.backgroundColor = '#ff4757';
        eb.style.borderRadius = '3px';
        let ex = enemy.x + enemy.width / 2 - 4;
        let ey = enemy.y + enemy.height;
        eb.style.left = ex + 'px';
        eb.style.top = ey + 'px';
        stageElem.appendChild(eb);
        
        // 弾のスピードもさらにゆっくり（1.0〜2.0）
        let randomSpeed = 1.0 + Math.random() * 1.0;
        enemyBullets.push({ x: ex, y: ey, speed: randomSpeed, element: eb });
    }

    function gameLoop() {
        if (!isPlaying) return;

        // 左右ボタンまたはキーボードでの移動処理
        if (keys['ArrowLeft'] || keys['a'] || movingLeft) castleX -= 5;
        if (keys['ArrowRight'] || keys['d'] || movingRight) castleX += 5;
        
        if (castleX < 0) castleX = 0;
        if (castleX > stageElem.clientWidth - castleWidth) castleX = stageElem.clientWidth - castleWidth;
        castleElem.style.left = castleX + 'px';

        // 自機の弾移動
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= 10;
            b.element.style.top = b.y + 'px';

            if (b.y < 0) {
                b.element.remove();
                bullets.splice(i, 1);
                continue;
            }

            for (let j = enemies.length - 1; j >= 0; j--) {
                let en = enemies[j];
                if (en.hp > 0 &&
                    b.x > en.x && b.x < en.x + en.width &&
                    b.y > en.y && b.y < en.y + en.height) {
                    
                    b.element.remove();
                    bullets.splice(i, 1);

                    en.hp--;
                    en.element.style.opacity = (en.hp / en.maxHp);

                    if (en.hp <= 0) {
                        en.element.remove();
                        score++;
                        document.getElementById('score-count').innerText = 4 - score;

                        if (score >= 4) {
                            endGame(true, "おめでとうございます！名古屋めしをすべて制覇しました！");
                            return;
                        }
                    }
                    break;
                }
            }
        }

        // 敵の弾移動
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let eb = enemyBullets[i];
            eb.y += eb.speed;
            eb.element.style.top = eb.y + 'px';

            if (eb.y > stageElem.clientHeight) {
                eb.element.remove();
                enemyBullets.splice(i, 1);
                continue;
            }

            // 当たり判定
            if (!hitCooldown && eb.x > castleX && eb.x < castleX + castleWidth &&
                eb.y > stageElem.clientHeight - castleHeight - 10 && eb.y < stageElem.clientHeight) {
                
                eb.element.remove();
                enemyBullets.splice(i, 1);

                sugarLevel += 25;
                document.getElementById('sugar-text').innerText = sugarLevel;
                document.getElementById('meter-bar').style.width = sugarLevel + '%';

                castleElem.classList.add('hit-flash');
                setTimeout(() => castleElem.classList.remove('hit-flash'), 400);

                if (sugarLevel >= 100) {
                    endGame(false, "血糖値が100%を超えてしまいました…！ゲームオーバー");
                    return;
                }

                hitCooldown = true;
                setTimeout(() => { hitCooldown = false; }, 500);
                break;
            }
        }

        loopInterval = requestAnimationFrame(gameLoop);
    }

    function endGame(isClear, message) {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        clearInterval(enemyShootInterval);
        cancelAnimationFrame(loopInterval);

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let titleText = isClear ? "✨ 大勝利（クリア）！" : "💥 血糖値オーバー！";
        document.getElementById('result-title').innerText = titleText;
        document.getElementById('result-message').innerHTML = '<div style="font-size:2.5rem; margin:5px 0;">' + (isClear ? '🏯🎉' : '🍩⚠️') + '</div>' + message + '<br><br>倒した名古屋めし： <b>'+ score +' / 4 個</b><br>最終血糖値： <b>'+ sugarLevel +'%</b>';

        var shareText = encodeURIComponent('名古屋めし防衛戦で名古屋めしを ' + score + ' 個討伐！最終血糖値 ' + sugarLevel + '% でした！\nあなたも名古屋城を守り抜こう！👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodeURIComponent(window.location.href) + '&hashtags=皓一部屋,名古屋めし,健康防衛軍';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'nagoya_game', 'score': score, 'clear': isClear});
        }
    }
</script>

</body>
</html>
