let currentQuestions = [];
let currentIndex = 0;
let score = 0;

function startQuiz() {
    currentQuestions = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 5);
    currentIndex = 0;
    score = 0;
    document.getElementById('menu-container').classList.add('hidden');
    document.getElementById('result-container').classList.add('hidden');
    document.getElementById('quiz-container').classList.remove('hidden');
    showQuestion();
}

function backToMenu() {
    document.getElementById('quiz-container').classList.add('hidden');
    document.getElementById('result-container').classList.add('hidden');
    document.getElementById('menu-container').classList.remove('hidden');
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    document.getElementById('category-title').innerText = "【" + q.category + "】";
    document.getElementById('question-count').innerText = `第 ${currentIndex + 1} 問 / 全 5 問`;
    document.getElementById('question-text').innerText = q.question;
    
    const choicesDiv = document.getElementById('choices-container');
    choicesDiv.innerHTML = '';
    
    q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = (index + 1) + '. ' + opt;
        btn.onclick = () => selectAnswer(index);
        choicesDiv.appendChild(btn);
    });
    
    document.getElementById('explanation-container').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
}

function selectAnswer(selectedIndex) {
    const q = currentQuestions[currentIndex];
    const choiceButtons = document.querySelectorAll('.choice-btn');
    
    choiceButtons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
            btn.classList.add('correct');
        } else if (idx === selectedIndex) {
            btn.classList.add('incorrect');
        }
    });
    
    if (selectedIndex === q.answer) {
        score++;
    }
    
    const expDiv = document.getElementById('explanation-container');
    expDiv.innerHTML = '<strong>【解説】</strong><br>' + q.explanation;
    expDiv.classList.remove('hidden');
    
    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-container').classList.add('hidden');
    document.getElementById('result-container').classList.remove('hidden');
    document.getElementById('score-text').innerText = `5問中 ${score}問正解でした！`;
}

function shareToX() {
    const text = encodeURIComponent(`解剖学・足の構造クイズに挑戦し、5問中${score}問正解しました！\n#解剖学 #足の構造 #セルフケア #皓一部屋`);
    window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
}
