<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>20秒リフレッシュゲーム | 皓一部屋</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f9fc;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .game-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      max-width: 360px;
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #2c3e50;
    }
    p {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0;
    }
    .timer-box {
      font-size: 1.8rem;
      font-weight: bold;
      color: #e74c3c;
      margin: 15px 0;
    }
    .massage-area {
      width: 180px;
      height: 180px;
      margin: 0 auto 20px;
      background-color: #eef2f5;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.1s ease;
    }
    .massage-area:active {
      transform: scale(0.95);
    }
    .avatar {
      font-size: 4rem;
      line-height: 1;
    }
    .status-text {
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 0;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .start-btn {
      background-color: #3498db;
      color: #fff;
    }
    .reserve-btn {
      background-color: #2ecc71;
      color: #fff;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="game-card">
  <h1>💆‍♂️ 20秒さすり体験</h1>
  <p>丸印の中を指でなでて（連打して）<br>凝りをほぐしてあげよう！</p>

  <div id="start-screen">
    <button class="btn start-btn" onclick="startGame()">スタート！</button>
  </div>

  <div id="game-screen" class="hidden">
    <div class="timer-box">残り <span id="timer">20</span> 秒</div>
    <div class="massage-area" onclick="rub()" ontouchstart="rub()">
      <div class="avatar" id="avatar">😫</div>
      <div class="status-text" id="status-text">カチコチ…</div>
    </div>
    <p>さすった回数: <span id="score" style="font-weight:bold; font-size:1.2rem; color:#3498db;">0</span> 回</p>
  </div>

  <div id="result-screen" class="hidden">
    <h2 style="color: #27ae60;">✨ スッキリ完了！</h2>
    <p id="result-message"></p>
    <a href="index.html" class="btn reserve-btn">ご予約・空き状況はこちら</a>
    <a href="game.html" style="display:block; margin-top:15px; color:#888; font-size:0.85rem; text-decoration:none;">もう一度あそぶ</a>
  </div>
</div>

<script>
  let timeLeft = 20;
  let score = 0;
  let timerInterval = null;

  function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    
    score = 0;
    timeLeft = 20;
    document.getElementById('score').innerText = score;
    document.getElementById('timer').innerText = timeLeft;

    timerInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function rub() {
    if (timeLeft <= 0) return;
    score++;
    document.getElementById('score').innerText = score;

    const avatar = document.getElementById('avatar');
    const statusText = document.getElementById('status-text');

    if (score > 40) {
      avatar.innerText = '😆✨';
      statusText.innerText = 'めちゃくちゃ軽やか！';
    } else if (score > 20) {
      avatar.innerText = '😌';
      statusText.innerText = '少しほぐれてきた！';
    } else if (score > 5) {
      avatar.innerText = '🙂';
      statusText.innerText = '効いてる…！';
    }
  }

  function endGame() {
    clearInterval(timerInterval);
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    const resultMessage = document.getElementById('result-message');
    resultMessage.innerHTML = `20秒で <b>${score} 回</b> ほぐせました！<br>画面の上でも効果抜群ですが、本物の施術はもっとスッキリしますよ👍`;
  }
</script>

</body>
</html>
