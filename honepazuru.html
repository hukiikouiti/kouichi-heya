<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>右足の骨 組み立てパズル</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
            text-align: center;
            touch-action: none;
        }
        h1 {
            font-size: 1.3rem;
            color: #333;
            margin: 5px 0;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 850px;
            background: #ffffff;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* 正解のドロップゾーン（シルエット枠） */
        .drop-zone {
            position: absolute;
            border: 2px dashed #b0c4de;
            background-color: rgba(240, 248, 255, 0.4);
            box-sizing: border-box;
        }
        /* パズルピース（大きく表示し、白い背景を透過させる） */
        .piece {
            position: absolute;
            cursor: grab;
            user-select: none;
            object-fit: contain;
            mix-blend-mode: multiply;
        }
        .piece:active {
            cursor: grabbing;
        }
        /* 残り50秒以下で点滅するアニメーション */
        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 2px rgba(255, 215, 0, 0.8)); opacity: 1; }
            50% { filter: drop-shadow(0 0 10px rgba(255, 69, 0, 1)); opacity: 0.6; }
            100% { filter: drop-shadow(0 0 2px rgba(255, 215, 0, 0.8)); opacity: 1; }
        }
        .blinking {
            animation: pulse-glow 0.8s infinite;
        }
        #ui-panel {
            margin-top: 5px;
            font-size: 1rem;
            font-weight: bold;
            color: #555;
        }
        #message {
            margin-top: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #d9534f;
            height: 1.5rem;
        }
        button {
            margin-top: 8px;
            padding: 8px 16px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>右足の骨 組み立てパズル</h1>
    <div id="ui-panel">
        残り時間: <span id="time">90</span>秒 | クリア: <span id="score">0</span> / 9
    </div>
    <div id="message"></div>

    <div id="game-container"></div>

    <button onclick="resetGame()">もう一度プレイ</button>

<script>
    // パーツの表示サイズ（w, h）を大きくし、配置座標（x, y）を調整
    const partsData = [
        { id: 'tibia', name: '脛骨', src: 'keikotu.jpeg', x: 180, y: 20, w: 160, h: 220 },
        { id: 'fibula', name: '腓骨', src: 'hikotu.jpeg', x: 330, y: 30, w: 90, h: 200 },
        { id: 'tarsals', name: '足根骨', src: 'syotukonkotu.jpeg', x: 165, y: 220, w: 220, h: 170 },
        { id: 'metatarsals', name: '中足骨', src: 'tyuusokukotu.jpeg', x: 170, y: 370, w: 210, h: 210 },
        { id: 'toe1', name: '親指趾骨', src: 'oyayubishikotu.jpeg', x: 320, y: 560, w: 80, h: 140 },
        { id: 'toe2', name: '人差し趾骨', src: 'hitosashiyubishikotu.jpeg', x: 260, y: 560, w: 70, h: 145 },
        { id: 'toe3', name: '中趾骨', src: 'nakayubishikotu.jpeg', x: 205, y: 560, w: 65, h: 140 },
        { id: 'toe4', name: '薬指趾骨', src: 'kusuriyubishikotu.jpeg', x: 155, y: 560, w: 65, h: 135 },
        { id: 'toe5', name: '小指趾骨', src: 'koyubishikotu.jpeg', x: 105, y: 560, w: 65, h: 130 }
    ];

    let timeLeft = 90;
    let timerId = null;
    let clearedCount = 0;
    let isPlaying = false;

    const container = document.getElementById('game-container');
    const timeDisplay = document.getElementById('time');
    const scoreDisplay = document.getElementById('score');
    const messageDisplay = document.getElementById('message');

    function initGame() {
        container.innerHTML = '';
        timeLeft = 90;
        clearedCount = 0;
        isPlaying = true;
        timeDisplay.textContent = timeLeft;
        scoreDisplay.textContent = clearedCount;
        messageDisplay.textContent = '';

        if (timerId) clearInterval(timerId);

        timerId = setInterval(() => {
            if (!isPlaying) return;
            timeLeft--;
            timeDisplay.textContent = timeLeft;

            if (timeLeft <= 50) {
                const pieces = document.querySelectorAll('.piece:not(.locked)');
                pieces.forEach(p => p.classList.add('blinking'));
            }

            if (timeLeft <= 0) {
                clearInterval(timerId);
                isPlaying = false;
                messageDisplay.textContent = 'タイムアップ！残念…';
                lockAllPieces();
            }
        }, 1000);

        partsData.forEach((part, index) => {
            const zone = document.createElement('div');
            zone.className = 'drop-zone';
            zone.style.left = part.x + 'px';
            zone.style.top = part.y + 'px';
            zone.style.width = part.w + 'px';
            zone.style.height = part.h + 'px';
            zone.dataset.id = part.id;
            container.appendChild(zone);

            const img = document.createElement('img');
            img.src = part.src;
            img.className = 'piece';
            img.dataset.id = part.id;
            img.style.width = part.w + 'px';
            img.style.height = part.h + 'px';

            // バラバラに配置する初期位置を画面下部にゆったりと配置
            const col = index % 3;
            const row = Math.floor(index / 3);
            const randomX = 30 + col * 180;
            const randomY = 710 + row * 70;
            img.style.left = randomX + 'px';
            img.style.top = randomY + 'px';

            makeDraggable(img, part);
            container.appendChild(img);
        });
    }

    function makeDraggable(element, partData) {
        let isDragging = false;
        let startX, startY;

        function startDrag(e) {
            if (!isPlaying || element.classList.contains('locked')) return;
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = clientX - element.offsetLeft;
            startY = clientY - element.offsetTop;
            element.style.zIndex = 1000;
        }

        function onDrag(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            element.style.left = (clientX - startX) + 'px';
            element.style.top = (clientY - startY) + 'px';
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            element.style.zIndex = 10;

            const currentX = parseInt(element.style.left);
            const currentY = parseInt(element.style.top);

            const targetX = partData.x;
            const targetY = partData.y;

            const distance = Math.hypot(currentX - targetX, currentY - targetY);

            // 当たり判定の許容範囲も拡大
            if (distance < 60) {
                element.style.left = targetX + 'px';
                element.style.top = targetY + 'px';
                element.classList.add('locked');
                element.classList.remove('blinking');
                element.style.cursor = 'default';
                
                element.onmousedown = null;
                element.ontouchstart = null;

                clearedCount++;
                scoreDisplay.textContent = clearedCount;

                if (clearedCount === partsData.length) {
                    clearInterval(timerId);
                    isPlaying = false;
                    messageDisplay.style.color = '#28a745';
                    messageDisplay.textContent = '🎉 お見事！完全クリア！';
                }
            }
        }

        element.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', endDrag);

        element.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', onDrag);
        window.addEventListener('touchend', endDrag);
    }

    function lockAllPieces() {
        document.querySelectorAll('.piece').forEach(p => {
            p.classList.remove('blinking');
        });
    }

    initGame();
</script>

</body>
</html>
