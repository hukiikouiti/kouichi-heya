<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本格解剖学・手の構造クイズ道場 | 皓一部屋</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #f7f9fc;
  color: #333;
  margin: 0;
  padding: 20px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
}
.quiz-card {
  background: #ffffff;
  padding: 25px 20px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  max-width: 480px;
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 20px;
}
.game-link-btn {
  display: block;
  width: 100%;
  padding: 16px 20px;
  margin-bottom: 15px;
  border-radius: 14px;
  font-weight: bold;
  text-decoration: none;
  font-size: 1rem;
  box-sizing: border-box;
  box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  cursor: pointer;
  border: none;
}
.quiz-btn-style {
  background: linear-gradient(135deg, #27ae60, #219653);
  color: #fff;
}
.hidden { display: none !important; }
.quiz-title { font-size: 1.1rem; color: #27ae60; margin-top: 0; font-weight: bold; }
.question-count { font-weight: bold; color: #666; font-size: 0.85rem; }
.question-text { font-size: 1rem; font-weight: bold; text-align: left; margin: 15px 0; line-height: 1.5; }
.choice-btn {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  background: #f1f3f5;
  color: #333;
  text-align: left;
  border: 1px solid #dcdde1;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  box-sizing: border-box;
  transition: all 0.2s;
}
.choice-btn:hover { background: #e4e7eb; }
.correct { background: #d4edda !important; color: #155724 !important; border-color: #c3e6cb !important; font-weight: bold; }
.incorrect { background: #f8d7da !important; color: #721c24 !important; border-color: #f5c6cb !important; }
.explanation-box { margin-top: 15px; padding: 12px; background: #e9ecef; border-radius: 8px; font-size: 0.85rem; text-align: left; line-height: 1.5; }
.next-btn { background: #3498db; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 0.95rem; }

@keyframes hintFlash {
  0%, 100% { background-color: #f1f3f5; color: #333; border-color: #dcdde1; transform: scale(1); }
  50% { background-color: #fde047; color: #854d0e; border-color: #eab308; transform: scale(1.02); }
}
.choice-btn.hint-flash {
  animation: hintFlash 0.6s infinite !important;
}
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="quiz-card" id="quiz-container">
  <div id="category-title" class="quiz-title">手の解剖学クイズ</div>
  <div id="question-count" class="question-count">第 1 問 / 全 5 問</div>
  <div id="question-text" class="question-text"></div>
  <div id="choices-container"></div>
  <div id="explanation-container" class="hidden explanation-box"></div>
  <button id="next-btn" class="hidden next-btn" onclick="nextQuestion()">次の問題へ</button>
  <a href="index.html" style="background: #95a5a6; color: #fff; margin-top: 15px; text-decoration: none; display: block; padding: 12px; border-radius: 8px; font-weight: bold;">メニューに戻る</a>
</div>

<div class="quiz-card hidden" id="result-container" style="text-align: center;">
  <h2 style="color: #2c3e50; font-size: 1.2rem;">クイズ結果発表</h2>
  <p id="score-text" style="font-size: 1.3rem; font-weight: bold; margin: 20px 0; color: #e67e22;"></p>
  <button onclick="shareToX()" class="game-link-btn" style="background: #000; color: #fff; margin-bottom: 10px;">X（旧Twitter）で結果をシェアする</button>
  <button onclick="startQuiz()" class="game-link-btn quiz-btn-style" style="margin-bottom: 10px;">もう一度挑戦する（別の5問）</button>
  <a href="index.html" class="game-link-btn" style="background: #95a5a6; color: #fff; text-decoration: none;">メニューに戻る</a>
</div>

<script>
const allQuestions = [
  {
    category: "手根骨・骨格",
    question: "人間の片手の手根骨は何個で構成されているか？",
    options: ["5個", "7個", "8個", "10個"],
    answer: 2,
    explanation: "手根骨は近位列4個、遠位列4個の合計8個の小さな骨で構成されています。"
  },
  {
    category: "手根骨・骨格",
    question: "手根骨の近位列（親指側から小指側へ）の正しい配列はどれ？",
    options: ["舟状骨・月状骨・三角骨・豆状骨", "大菱形骨・小菱形骨・有頭骨・有鈎骨", "舟状骨・有頭骨・月状骨・三角骨", "豆状骨・三角骨・月状骨・舟状骨"],
    answer: 0,
    explanation: "近位列は橈骨側から順に「舟状骨、月状骨、三角骨、豆状骨」の4個が並びます。"
  },
  {
    category: "手根骨・骨格",
    question: "手根骨の遠位列（親指側から小指側へ）の正しい配列はどれ？",
    options: ["大菱形骨・小菱形骨・有頭骨・有鈎骨", "舟状骨・月状骨・三角骨・豆状骨", "有頭骨・有鈎骨・小菱形骨・大菱形骨", "三角骨・有頭骨・月状骨・大菱形骨"],
    answer: 0,
    explanation: "遠位列は親指側から「大菱形骨、小菱形骨、有頭骨、有鈎骨」の4個が並びます。"
  },
  {
    category: "手根骨・骨格",
    question: "手根骨の中で、最も大きく中心に位置し、手根骨の中心的な支柱となる骨はどれ？",
    options: ["有頭骨", "舟状骨", "月状骨", "有鈎骨"],
    answer: 0,
    explanation: "有頭骨（ゆうとうこつ）は手根骨の中で最も大きく、中央に位置して手首の安定に寄与します。"
  },
  {
    category: "手根骨・骨格",
    question: "転倒時に手をついた際、手首の骨の中で最も骨折しやすい（頻度が最も高い）骨はどれ？",
    options: ["舟状骨", "豆状骨", "小菱形骨", "有鈎骨"],
    answer: 0,
    explanation: "舟状骨は手関節の衝撃を受けやすく、血流が特殊なため骨折すると偽関節になりやすい特徴があります。"
  }
];

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let hintTimer = null;

window.onload = function() {
  startQuiz();
};

function startQuiz() {
  currentQuestions = [...allQuestions].sort(() => 0.5 - Math.random());
  currentIndex = 0;
  score = 0;
  document.getElementById('result-container').classList.add('hidden');
  document.getElementById('quiz-container').classList.remove('hidden');
  showQuestion();
}

function showQuestion() {
  if (hintTimer) {
    clearTimeout(hintTimer);
    hintTimer = null;
  }

  const q = currentQuestions[currentIndex];
  document.getElementById('category-title').innerText = "【" + q.category + "】";
  document.getElementById('question-count').innerText = "第 " + (currentIndex + 1) + " 問 / 全 5 問";
  document.getElementById('question-text').innerText = q.question;
  
  const choicesDiv = document.getElementById('choices-container');
  choicesDiv.innerHTML = '';
  
  q.options.forEach((opt, index) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.setAttribute('data-index', index);
    btn.innerText = (index + 1) + '. ' + opt;
    btn.onclick = function() { selectAnswer(index); };
    choicesDiv.appendChild(btn);
  });
  
  document.getElementById('explanation-container').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');

  // 5秒後に正解ボタンをピカピカ点滅させる
  hintTimer = setTimeout(function() {
    const choiceButtons = document.querySelectorAll('.choice-btn');
    choiceButtons.forEach(function(btn) {
      const btnIndex = parseInt(btn.getAttribute('data-index'), 10);
      if (btnIndex === q.answer) {
        btn.classList.add('hint-flash');
      }
    });
  }, 5000);
}

function selectAnswer(selectedIndex) {
  if (hintTimer) {
    clearTimeout(hintTimer);
    hintTimer = null;
  }

  const q = currentQuestions[currentIndex];
  const choiceButtons = document.querySelectorAll('.choice-btn');
  
  choiceButtons.forEach(function(btn, idx) {
    btn.disabled = true;
    btn.classList.remove('hint-flash');

    if (idx === q.answer) {
      btn.classList.add('correct');
    } else if (idx === selectedIndex) {
      btn.classList.add('incorrect');
    }
  });
  
  if (selectedIndex === q.answer) {
    score++;
  }
  
  const expDiv = document.getElementById('explanation-container');
  expDiv.innerHTML = '<strong>【解説】</strong><br>' + q.explanation;
  expDiv.classList.remove('hidden');
  
  document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  if (hintTimer) {
    clearTimeout(hintTimer);
    hintTimer = null;
  }
  document.getElementById('quiz-container').classList.add('hidden');
  const resultContainer = document.getElementById('result-container');
  resultContainer.classList.remove('hidden');
  
  const scoreText = document.getElementById('score-text');
  let message = "";
  if (score === 5) {
    message = "5問正解！お見事！完璧な手の解剖学マスターです！";
  } else if (score >= 3) {
    message = score + "問正解！なかなかの知識量ですね！";
  } else {
    message = score + "問正解！マニアックな難問でしたね、ぜひまた挑戦してね！";
  }
  scoreText.innerText = message;
}

function shareToX() {
  const text = encodeURIComponent("【本格解剖学・手の構造クイズ道場】に挑戦し、5問中 " + score + "問正解しました！🧠✨\n#皓一部屋 #解剖学クイズ");
  window.open("https://twitter.com/intent/tweet?text=" + text, "_blank");
}
</script>

</body>
</html>
