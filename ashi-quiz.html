<style>

.choice-btn:hover { background: #e4e7eb; }

<div class="quiz-card" id="quiz-container">
  <div id="category-title" class="quiz-title">足と膝の解剖学クイズ</div>
  <div id="question-count" class="question-count">第 1 問 / 全 5 問</div>
  <div id="question-text" class="question-text"></div>
  <div id="choices-container"></div>
  <div id="explanation-container" class="hidden explanation-box"></div>
  <button id="next-btn" class="hidden next-btn" onclick="nextQuestion()">次の問題へ</button>
  <a href="game.html" class="game-link-btn" style="background: #95a5a6; color: #fff; margin-top: 15px; text-decoration: none;">🎮 ゲームに戻る</a>

<div class="quiz-card hidden" id="result-container" style="text-align: center;">
  <h2 style="color: #2c3e50; font-size: 1.2rem;">クイズ結果発表</h2>
  <p id="score-text" style="font-size: 1.3rem; font-weight: bold; margin: 20px 0; color: #e67e22;"></p>
  <button onclick="startQuiz()" class="game-link-btn quiz-btn-style">もう一度挑戦する（別の5問）</button>
  <button onclick="shareToX()" class="game-link-btn" style="background: #000; color: #fff;">𝕏 で結果をシェアする</button>
  <!-- LINEお友達追加ボタン -->
  <a href="https://lin.ee/7Lb96Ev" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #06c755, #05b34c); color: #fff;">🟢 LINEお友達追加</a>

  <a href="game.html" class="game-link-btn" style="background: #95a5a6; color: #fff;">🎮 ゲームに戻る</a>

<script>
const allQuestions = [
  {
    category: "膝蓋骨・下腿骨格",
    question: "人体最大の種子骨であり、大腿四頭筋の腱の中に存在して膝の曲げ伸ばしを効率化する骨はどれ？",
    options: ["脛骨", "腓骨", "膝蓋骨（皿）", "距骨"],
    answer: 2,
    explanation: "膝蓋骨は太ももの筋肉の力を効率よく脛に伝えるための重要な種子骨です。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "膝蓋骨のすぐ下（下縁）から脛骨の出っ張り（脛骨粗面）を結ぶ強力な組織の名称はどれ？",
    options: ["膝蓋靭帯（膝蓋腱）", "アキレス腱", "腸脛靭帯", "足底腱膜"],
    answer: 0,
    explanation: "大腿四頭筋の力が膝蓋靭帯を介して脛骨粗面に伝わり、膝を伸ばすことができます。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "成長期のスポーツ少年に多く見られる、膝蓋靭帯が付着する脛骨粗面付近の牽引性障害の通称はどれ？",
    options: ["オグッド病（オスグッド・シュラッター病）", "テニス肘", "シンスプリント", "外反母趾"],
    answer: 0,
    explanation: "オスグッド病は、大腿四頭筋に引っ張られることで脛骨粗面に負担がかかり痛みや隆起が生じる疾患です。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "膝を深く曲げたとき、膝蓋骨が滑り込む大腿骨側の溝の名称はどれ？",
    options: ["大腿骨滑車", "烏口突起", "外果", "内果"],
    answer: 0,
    explanation: "膝蓋骨は大腿骨前面の溝（大腿骨滑車）に沿って上下にスムーズにスライドします。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "すねの外側を触ったときに確認できる、足首の外くるぶしへと繋がる細い骨の名称はどれ？",
    options: ["腓骨", "脛骨", "橈骨", "尺骨"],
    answer: 0,
    explanation: "腓骨はすねの外側を支える細い骨で、足関節の外側の安定や筋肉の付着部となります。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "すねの内側にあって体重を主に支える、足首の内くるぶしを形成する太い骨はどれ？",
    options: ["脛骨", "腓骨", "距骨", "踵骨"],
    answer: 0,
    explanation: "脛骨（けいこつ）は体重の大部分を支える下腿のメインの太い骨です。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "膝関節の内部にあり、大腿骨と脛骨の間で衝撃を和らげるC字型・O字型の軟骨組織の名称はどれ？",
    options: ["半月板（内側・外側半月）", "関節唇", "靭帯", "滑液包"],
    answer: 0,
    explanation: "半月板はクッションの役割を果たし、関節の適合性を高めます。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "膝関節の真ん中にあり、脛骨が前方にズレるのを防ぐ最も重要な靭帯はどれ？",
    options: ["前十字靭帯（ACL）", "後十字靭帯（PCL）", "内側側副靭帯", "外側側副靭帯"],
    answer: 0,
    explanation: "前十字靭帯はスポーツ中の急停止や方向転換で損傷しやすい靭帯です。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "膝関節の後方にあり、脛骨が後方にズレるのを防ぐ強力な靭帯はどれ？",
    options: ["後十字靭帯（PCL）", "前十字靭帯", "膝蓋靭帯", "踵腓靭帯"],
    answer: 0,
    explanation: "後十字靭帯は後ろ方向への強い外力から膝を守ります。"
  },
  {
    category: "膝蓋骨・下腿骨格",
    question: "膝の内側にあって、外側からの力に対して膝が内側に折れ曲がるのを防ぐ靭帯はどれ？",
    options: ["内側側副靭帯（MCL）", "外側側副靭帯", "前十字靭帯", "踵腓靭帯"],
    answer: 0,
    explanation: "内側側副靭帯は膝の内側の安定性を保ちます。"
  },
  {
    category: "筋肉・筋膜",
    question: "ふくらはぎを形成し、足首を下に踏み出す（底屈）作用を持つ浅層の大きな筋肉はどれ？",
    options: ["腓腹筋", "前脛骨筋", "長母趾伸筋", "骨間筋"],
    answer: 0,
    explanation: "腓腹筋は二関節筋であり、ジャンプやダッシュに大きく寄与します。"
  },
  {
    category: "筋肉・筋膜",
    question: "腓腹筋の深層にあり、持久力に優れ「第二の心臓」のポンプ機能の主役となる筋肉はどれ？",
    options: ["ヒラメ筋", "大腿直筋", "縫工筋", "薄筋"],
    answer: 0,
    explanation: "ヒラメ筋は静脈血を心臓へ押し上げるポンプとして非常に重要です。"
  },
  {
    category: "筋肉・筋膜",
    question: "踵の後面に付着し、人体で最も強力とされる腱の名称はどれ？",
    options: ["アキレス腱（跟骨腱）", "膝蓋腱", "腸脛靭帯", "足底腱膜"],
    answer: 0,
    explanation: "下腿三頭筋の力がアキレス腱を介して踵骨に伝わります。"
  },
  {
    category: "筋肉・筋膜",
    question: "すねの前外側を走り、足首を上に向ける（背屈）主動筋はどれ？",
    options: ["前脛骨筋", "腓腹筋", "後脛骨筋", "長腓骨筋"],
    answer: 0,
    explanation: "前脛骨筋は歩行時につま先が下がらないように持ち上げる働きをします。"
  },
  {
    category: "筋肉・筋膜",
    question: "足首を内側に返す（内反）働きにおいて、前脛骨筋と共に非常に重要な役割を持つ深層の筋肉はどれ？",
    options: ["後脛骨筋", "長腓骨筋", "短腓骨筋", "足底筋"],
    answer: 0,
    explanation: "後脛骨筋は足裏を通って舟状骨等に付着し、内側縦アーチを吊り上げます。"
  }
];

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function startQuiz() {
  document.getElementById('result-container').classList.add('hidden');
  document.getElementById('quiz-container').classList.remove('hidden');
  
  // ランダムに5問抽出
  let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
  currentQuestions = shuffled.slice(0, 5);
  currentIndex = 0;
  score = 0;
  showQuestion();
}

function showQuestion() {
  answered = false;
  let q = currentQuestions[currentIndex];
  document.getElementById('category-title').innerText = "足と膝の解剖学クイズ（" + q.category + "）";
  document.getElementById('question-count').innerText = "第 " + (currentIndex + 1) + " 問 / 全 5 問";
  document.getElementById('question-text').innerText = q.question;
  
  let choicesContainer = document.getElementById('choices-container');
  choicesContainer.innerHTML = '';
  
  q.options.forEach((opt, index) => {
    let btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerText = (index + 1) + ". " + opt;
    btn.onclick = () => selectChoice(index);
    choicesContainer.appendChild(btn);
  });
  
  document.getElementById('explanation-container').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');
}

function selectChoice(index) {
  if (answered) return;
  answered = true;
  
  let q = currentQuestions[currentIndex];
  let choiceButtons = document.querySelectorAll('.choice-btn');
  
  if (index === q.answer) {
    choiceButtons[index].classList.add('correct');
    score++;
  } else {
    choiceButtons[index].classList.add('incorrect');
    choiceButtons[q.answer].classList.add('correct');
  }
  
  let expBox = document.getElementById('explanation-container');
  expBox.innerHTML = '<b>【解説】</b><br>' + q.explanation;
  expBox.classList.remove('hidden');
  
  document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quiz-container').classList.add('hidden');
  document.getElementById('result-container').classList.remove('hidden');
  
  let resultMsg = "5問中 " + score + "問正解でした！";
  if (score === 5) {
    resultMsg += "<br>🎉 パーフェクト！素晴らしい解剖学の知識です！";
  } else if (score >= 3) {
    resultMsg += "<br>👍 お見事！かなりの解剖学マスターですね！";
  } else {
    resultMsg += "<br>💡 もう一度挑戦して知識を深めましょう！";
  }
  document.getElementById('score-text').innerHTML = resultMsg;
}

function shareToX() {
  let text = encodeURIComponent("【足と膝の構造クイズ道場】で 5問中 " + score + "問正解しました！🦴✨\n#皓一部屋 #解剖学クイズ");
  window.open("https://twitter.com/intent/tweet?text=" + text + "&url=" + encodeURIComponent(window.location.href), "_blank");
}

// ページ読み込み時に自動スタート
window.onload = function() {
  startQuiz();
};
</script>

</body>
