<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コリンの神経衰弱 ～記憶力活性化チャレンジ～ - 皓一部屋</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f7f9fc;
            --card-back: #34495e;
            --card-front: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 1.1rem;
            color: var(--primary-color);
            margin-bottom: 6px;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        /* ゲーム盤：12枚（4列×3行） */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 75px);
            gap: 10px;
            margin: 0 auto 15px;
            justify-content: center;
        }
        @media (max-width: 360px) {
            .game-board {
                grid-template-columns: repeat(4, 65px);
                gap: 8px;
            }
        }
        .card {
            width: 75px;
            height: 95px;
            background-color: var(--card-back);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
            user-select: none;
        }
        @media (max-width: 360px) {
            .card {
                width: 65px;
                height: 85px;
                font-size: 1.5rem;
            }
        }
        .card.flipped {
            background-color: var(--card-front);
            border: 2px solid var(--primary-color);
            transform: scale(1.05);
            color: #333;
        }

        /* 裏面のときのヒントの光 */
        .card.hint-1 { box-shadow: 0 0 10px 2px rgba(230, 126, 34, 0.6); border: 2px dashed #e67e22; }
        .card.hint-2 { box-shadow: 0 0 10px 2px rgba(52, 152, 219, 0.6); border: 2px dashed #3498db; }
        .card.hint-3 { box-shadow: 0 0 10px 2px rgba(39, 174, 96, 0.6); border: 2px dashed #27ae60; }
        .card.hint-4 { box-shadow: 0 0 10px 2px rgba(155, 89, 182, 0.6); border: 2px dashed #9b59b6; }
        .card.hint-5 { box-shadow: 0 0 10px 2px rgba(231, 76, 60, 0.6); border: 2px dashed #e74c3c; }
        .card.hint-6 { box-shadow: 0 0 10px 2px rgba(241, 196, 15, 0.6); border: 2px dashed #f1c40f; }

        /* 揃ったペアのエフェクト */
        @keyframes pulseGlow1 { 0% { border-color: #e67e22; box-shadow: 0 0 5px #e67e22; } 50% { border-color: #f39c12; box-shadow: 0 0 15px #f39c12; } 100% { border-color: #e67e22; box-shadow: 0 0 5px #e67e22; } }
        @keyframes pulseGlow2 { 0% { border-color: #3498db; box-shadow: 0 0 5px #3498db; } 50% { border-color: #2980b9; box-shadow: 0 0 15px #2980b9; } 100% { border-color: #3498db; box-shadow: 0 0 5px #3498db; } }
        @keyframes pulseGlow3 { 0% { border-color: #27ae60; box-shadow: 0 0 5px #27ae60; } 50% { border-color: #2ecc71; box-shadow: 0 0 15px #2ecc71; } 100% { border-color: #27ae60; box-shadow: 0 0 5px #27ae60; } }
        @keyframes pulseGlow4 { 0% { border-color: #9b59b6; box-shadow: 0 0 5px #9b59b6; } 50% { border-color: #8e44ad; box-shadow: 0 0 15px #8e44ad; } 100% { border-color: #9b59b6; box-shadow: 0 0 5px #9b59b6; } }
        @keyframes pulseGlow5 { 0% { border-color: #e74c3c; box-shadow: 0 0 5px #e74c3c; } 50% { border-color: #c0392b; box-shadow: 0 0 15px #c0392b; } 100% { border-color: #e74c3c; box-shadow: 0 0 5px #e74c3c; } }
        @keyframes pulseGlow6 { 0% { border-color: #f1c40f; box-shadow: 0 0 5px #f1c40f; } 50% { border-color: #f39c12; box-shadow: 0 0 15px #f39c12; } 100% { border-color: #f1c40f; box-shadow: 0 0 5px #f1c40f; } }

        .matched.pair-1 { background-color: #fef5e7; border: 3px solid #e67e22; animation: pulseGlow1 1.2s infinite; }
        .matched.pair-2 { background-color: #ebf5fb; border: 3px solid #3498db; animation: pulseGlow2 1.2s infinite; }
        .matched.pair-3 { background-color: #e8f8f5; border: 3px solid #27ae60; animation: pulseGlow3 1.2s infinite; }
        .matched.pair-4 { background-color: #f4ecf7; border: 3px solid #9b59b6; animation: pulseGlow4 1.2s infinite; }
        .matched.pair-5 { background-color: #f5b7b1; border: 3px solid #e74c3c; animation: pulseGlow5 1.2s infinite; }
        .matched.pair-6 { background-color: #fef9e7; border: 3px solid #f1c40f; animation: pulseGlow6 1.2s infinite; }

        .card.matched {
            cursor: default;
            opacity: 0.95;
            color: #333;
        }

        /* メッセージ表示エリア */
        #message-box {
            width: 100%;
            min-height: 55px;
            background: #fff;
            border-left: 5px solid var(--accent-color);
            padding: 10px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-radius: 0 8px 8px 0;
            margin-bottom: 15px;
            font-size: 0.85rem;
            line-height: 1.4;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            text-align: left;
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .start-btn {
            background-color: #0288d1;
            color: #fff;
            border-radius: 30px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h1>🧠 コリンの神経衰弱</h1>
    <p>同じ絵柄のカードを揃えて脳内神経ネットワークを繋げ！星野青龍のボイス＆セリフ付き！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">🧬🥚</div>
        <button class="btn start-btn" onclick="startGame()">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="game-board" id="board"></div>
        <div id="message-box">カードをめくって同じ絵のペアを見つけよう！</div>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 style="color: #0288d1; font-size: 1.2rem; margin-top: 0;">🎉 脳内フル回転クリア！</h2>
        
        <div id="result-message" style="font-size: 0.9rem; margin: 15px 0; color: #333; line-height: 1.6; text-align: left; background: #f9f9f9; padding: 12px; border-radius: 10px;"></div>

        <!-- 1列目：LINEお友達追加 -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #06c755, #05b34c); color: #fff;">🟢 LINEお友達追加</a>

        <!-- 2列目：予約する -->
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #27ae60, #219653); color: #fff;">📅 予約する（空き状況確認・ご予約）</a>

        <!-- 3列目：Xで結果をシェア -->
        <a id="share-link" target="_blank" class="game-link-btn" style="background: #000; color: #fff; font-size: 0.95rem;">𝕏 で結果をシェアする</a>

        <!-- ボタンを格納するエリア -->
        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;">

            <!-- 1段目：「もう一度あそぶ」＆「クイズ選択に戻る」を横並び -->
            <div style="display: flex; gap: 8px; width: 100%;">
                <button onclick="startGame()" style="flex: 1; padding: 12px 5px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-sizing: border-box;">
                    もう一度あそぶ
                </button>
                <a href="kuizu.html" style="flex: 1; display: block; padding: 12px 5px; background: #7f8c8d; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    クイズ選択に戻る
                </a>
            </div>

            <!-- 2段目：「ゲーム選択に戻る」＆「トップに戻る」を横並び -->
            <div style="display: flex; gap: 8px; width: 100%;">
                <a href="game.html" style="flex: 1; display: block; padding: 12px 5px; background: #e67e22; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    🎮 ゲーム選択に戻る
                </a>
                <a href="index.html" style="flex: 1; display: block; padding: 12px 5px; background: #95a5a6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    🏠 トップに戻る
                </a>
            </div>

        </div>
    </div>
</div>

<!-- 効果音用（Web Audio APIで自動生成するためファイル不要） -->
<audio id="voice6" src="korin6.wav" preload="auto"></audio>

<script>
    const baseCards = [
        { id: 1, icon: '🥚' }, { id: 1, icon: '🥚' },
        { id: 2, icon: '⚡' }, { id: 2, icon: '⚡' },
        { id: 3, icon: '🛡️' }, { id: 3, icon: '🛡️' },
        { id: 4, icon: '💡' }, { id: 4, icon: '💡' },
        { id: 5, icon: '🧘' }, { id: 5, icon: '🧘' },
        { id: 6, icon: '✨' }, { id: 6, icon: '✨' }
    ];

    const finalMessage = "「【脳内フル回転クリア】神経も記憶力も完璧に整いました！ これもう君、天才的だな……。さあ、この冴えた頭で次の癒やしへ進むとしようか。」";

    let currentGameCards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let isLocked = false;
    let audioCtx = null;

    // 効果音（Web Audio API）
    function playSound(type) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // 正解チャイム（高めの明るい2音）
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                // 不正解ブザー（低めの低い2音）
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        } catch (e) {
            console.log("Web Audio再生エラー:", e);
        }
    }

    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startGame() {
        const board = document.getElementById('board');
        const messageBox = document.getElementById('message-box');
        const startScreen = document.getElementById('game-start-screen');
        const playScreen = document.getElementById('game-play-screen');
        const resultScreen = document.getElementById('game-result-screen');

        board.innerHTML = '';
        messageBox.textContent = "カードをめくって同じ絵のペアを見つけよう！";
        
        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        playScreen.classList.remove('hidden');

        flippedCards = [];
        matchedPairs = 0;
        isLocked = false;

        currentGameCards = shuffle(baseCards);

        currentGameCards.forEach((item, index) => {
            const card = document.createElement('div');
            card.classList.add('card', `hint-${item.id}`);
            card.dataset.index = index;
            card.textContent = '？';
            card.addEventListener('pointerdown', handleCardClick);
            board.appendChild(card);
        });

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'korin_memory_game'});
        }
    }

    function handleCardClick(e) {
        e.preventDefault();
        if (isLocked) return;
        if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

        const index = parseInt(this.dataset.index);
        const cardInfo = currentGameCards[index];

        this.classList.add('flipped');
        this.textContent = cardInfo.icon;
        flippedCards.push({ element: this, card: cardInfo });

        if (flippedCards.length === 2) {
            checkMatch();
        }
    }

    function checkMatch() {
        const [first, second] = flippedCards;
        isLocked = true;

        if (first.card.id === second.card.id) {
            first.element.classList.remove(`hint-${first.card.id}`);
            second.element.classList.remove(`hint-${second.card.id}`);
            first.element.classList.add('matched', `pair-${first.card.id}`);
            second.element.classList.add('matched', `pair-${second.card.id}`);
            matchedPairs++;
            flippedCards = [];

            if (matchedPairs === 6) {
                // クリア時：チャイムを鳴らしてから少し遅れてクリア画面と青龍ボイス
                playSound('correct');
                document.getElementById('message-box'].textContent = "🎉 神経ネットワーク完全接続！";

                setTimeout(() => {
                    document.getElementById('game-play-screen').classList.add('hidden');
                    document.getElementById('result-message').innerHTML = '<b>星野青龍のメッセージ：</b><br>' + finalMessage;
                    document.getElementById('game-result-screen').classList.remove('hidden');

                    try {
                        let finalVoice = document.getElementById('voice6');
                        if (finalVoice) {
                            finalVoice.currentTime = 0;
                            finalVoice.play();
                        }
                    } catch (e) {
                        console.log("クリア音声再生スキップ:", e);
                    }

                    var shareText = encodeURIComponent('コリンの神経衰弱をクリアしました！\n脳内神経ネットワークがバッチリ整いました✨\n\nあなたも脳をスッキリさせてみませんか？👇');
                    document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/korin.html') + '&hashtags=皓一部屋,コリン,健康エンタメ,名古屋マッサージ';

                    if (window.dataLayer) {
                        window.dataLayer.push({'event': 'game_finish', 'game_name': 'korin_memory_game'});
                    }
                }, 800);

            } else {
                // 通常ペア成立：正解チャイム音
                playSound('correct');
                document.getElementById('message-box'].textContent = "✨ ペア成立！神経ネットワークがつながった！";
                setTimeout(() => {
                    isLocked = false;
                }, 600);
            }
        } else {
            // 不正解：ブザー音
            playSound('wrong');
            document.getElementById('message-box'].textContent = "❌ 残念、違うペアでした…";
            setTimeout(() => {
                first.element.classList.remove('flipped');
                first.element.textContent = '？';
                second.element.classList.remove('flipped');
                second.element.textContent = '？';
                flippedCards = [];
                document.getElementById('message-box'].textContent = "カードをめくって同じ絵のペアを見つけよう！";
                isLocked = false;
            }, 900);
        }
    }
</script>

</body>
</html>
