<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f7f9fc;
    color: #333;
    margin: 0;
    padding: 15px 10px;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    box-sizing: border-box;
  }
  .game-card {
    background: #ffffff;
    padding: 20px 15px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    max-width: 420px;
    width: 100%;
    box-sizing: border-box;
  }
  h1 {
    font-size: 1.1rem;
    margin-bottom: 5px;
    color: #2c3e50;
  }
  p {
    font-size: 0.8rem;
    color: #666;
    margin-top: 0;
    margin-bottom: 12px;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    font-weight: bold;
    margin-bottom: 10px;
    color: #e94560;
  }
  #maze-container {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: 1px;
    background-color: #2c3e50;
    padding: 4px;
    border-radius: 10px;
    margin: 0 auto 15px auto;
    max-width: 330px;
    aspect-ratio: 1 / 1;
    box-sizing: border-box;
  }
  .cell {
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    user-select: none;
    border-radius: 2px;
  }
  .wall {
    background-color: #34495e;
  }
  .path {
    background-color: #ffffff;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 240px;
    margin: 0 auto 15px auto;
  }
  .ctrl-btn {
    background: linear-gradient(135deg, #3498db, #2980b9);
    color: #fff;
    border: none;
    padding: 14px 0;
    font-size: 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
  }
  .ctrl-btn:active {
    transform: scale(0.95);
  }
  .ctrl-btn.empty {
    background: transparent;
    box-shadow: none;
    pointer-events: none;
  }
  .result-box {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #eef2f7;
    border-radius: 12px;
  }
  .result-box h2 {
    font-size: 1rem;
    margin-top: 0;
    color: #27ae60;
  }
  .action-btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    font-weight: bold;
    text-decoration: none;
    font-size: 0.9rem;
    color: #fff;
    box-sizing: border-box;
    border: none;
    cursor: pointer;
  }
  .line-btn { background: linear-gradient(135deg, #06c755, #05b14c); }
  .book-btn { background: linear-gradient(135deg, #e94560, #c73650); }
  .x-btn { background: linear-gradient(135deg, #111111, #333333); }
  .retry-btn { background: linear-gradient(135deg, #7f8c8d, #637071); margin-top: 8px; }

    display: inline-block;
    margin-top: 15px;
    color: #3498db;

    text-decoration: none;

<body>

<div class="game-card">
  <h1>🏃‍♂️ 血糖値デトックス迷路</h1>
  <p>甘い誘惑（🍩）を避けて、ヘルシーな食事（🥗）のゴールを目指せ！</p>

  <div class="status-bar">
    <span id="time-text">残り時間: 30秒</span>
    <span id="glucose-text">血糖値: 100mg/dL</span>
  </div>

  <!-- 迷路描画エリア -->
  <div id="maze-container"></div>

  <!-- 操作十字キー（スマホ用） -->
  <div class="controls" id="control-pads">
    <div class="ctrl-btn empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(0, -1)">⬆️</button>
    <div class="ctrl-btn empty"></div>
    <button class="ctrl-btn" onclick="movePlayer(-1, 0)">⬅️</button>
    <button class="ctrl-btn" onclick="movePlayer(0, 1)">⬇️</button>
    <button class="ctrl-btn" onclick="movePlayer(1, 0)">➡️</button>
  </div>

  <!-- リザルト画面 -->
  <div class="result-box" id="result-box">
    <h2 id="result-title">クリア！</h2>
    <p id="result-desc">上手に血糖値をコントロールできました！</p>
    
    <a href="https://line.me" target="_blank" class="action-btn line-btn">💬 LINEで無料相談・予約する</a>
    <a href="https://hukiikouiti.github.io/kouichi-heya/" class="action-btn book-btn">💆‍♂️ 名古屋出張リラクゼーション詳細</a>
    <a href="https://twitter.com/intent/tweet?text=%E7%B3%96%E5%B0%BF%E5%80%A4%E3%83%87%E3%83%88%E3%83%83%E3%82%AF%E3%82%B9%E5%BF%83%E3%83%AC%E3%83%BC%E3%82%B9%E3%82%92%E3%82%AF%E3%83%AA%E3%82%A2%E3%81%97%E3%81%9F%EF%BC%81%20%23%E7%9A%93%E4%B8%80%E9%83%A8%E5%B1%8B" target="_blank" class="action-btn x-btn">🐦 結果をXでシェアする</a>
    <button class="action-btn retry-btn" onclick="initGame()">もう一度挑戦する</button>
  </div>

  <a href="game.html" class="back-link">🎮 ゲームメニューに戻る</a>
</div>

<script>
  const rows = 11;
  const cols = 11;
  let maze = [];
  let pX = 1, pY = 1;
  let gX = 9, gY = 9;
  let glucose = 100;
  let timeLeft = 30;
  let timerId = null;
  let isPlaying = true;
  let traps = [];

  function initGame() {
    clearInterval(timerId);
    glucose = 100;
    timeLeft = 30;
    isPlaying = true;
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('control-pads').style.display = 'grid';
    
    generateMaze();
    startTimer();
    updateView();
  }

  // 穴掘り法による迷路自動生成
  function generateMaze() {
    maze = Array(rows).fill(0).map(() => Array(cols).fill(1));
    
    function carve(x, y) {
      maze[y][x] = 0;
      const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
      for (let [dx, dy] of dirs) {
        let nx = x + dx, ny = y + dy;
        if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && maze[ny][nx] === 1) {
          maze[y + dy / 2][x + dx / 2] = 0;
          carve(nx, ny);
        }
      }
    }
    carve(1, 1);
    
    pX = 1; pY = 1;
    maze[pY][pX] = 0;
    
    // ゴールを右下に設置し、周囲を開通
    gX = cols - 2;
    gY = rows - 2;
    maze[gY][gX] = 0;
    maze[gY-1][gX] = 0;
    maze[gY][gX-1] = 0;

    // 罠（甘い誘惑 🍩）をランダムに3〜4個配置
    traps = [];
    while (traps.length < 4) {
      let tx = Math.floor(Math.random() * (cols - 2)) + 1;
      let ty = Math.floor(Math.random() * (rows - 2)) + 1;
      if (maze[ty][tx] === 0 && !(tx === 1 && ty === 1) && !(tx === gX && ty === gY)) {
        if (!traps.some(t => t.x === tx && t.y === ty)) {
          traps.push({x: tx, y: ty});
        }
      }
    }
  }

  function startTimer() {
    timerId = setInterval(() => {
      if (!isPlaying) return;
      timeLeft--;
      document.getElementById('time-text').innerText = `残り時間: ${timeLeft}秒`;
      if (timeLeft <= 0 || glucose >= 250) {
        endGame(false);
      }
    }, 1000);
  }

  function movePlayer(dx, dy) {
    if (!isPlaying) return;
    let nx = pX + dx;
    let ny = pY + dy;
    
    if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && maze[ny][nx] === 0) {
      pX = nx;
      pY = ny;
      
      // 罠を踏んだかチェック
      let trapIndex = traps.findIndex(t => t.x === pX && t.y === pY);
      if (trapIndex !== -1) {
        glucose += 40; // 血糖値上昇
        traps.splice(trapIndex, 1); // 食べたので消える
      } else {
        glucose -= 2; // 歩くごとに少し消費
        if (glucose < 80) glucose = 80;
      }
      
      // ゴール判定
      if (pX === gX && pY === gY) {
        endGame(true);
      } else {
        updateView();
      }
    }
  }

  function updateView() {
    const container = document.getElementById('maze-container');
    container.innerHTML = '';
    
    document.getElementById('glucose-text').innerText = `血糖値: ${glucose}mg/dL`;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        
        if (x === pX && y === pY) {
          cell.innerText = '🧍‍♂️';
        } else if (x === gX && y === gY) {
          cell.innerText = '🥗';
        } else if (traps.some(t => t.x === x && t.y === y)) {
          cell.innerText = '🍩';
        } else if (maze[y][x] === 1) {
          cell.className += ' wall';
        } else {
          cell.className += ' path';
        }
        container.appendChild(cell);
      }
    }
  }

  function endGame(success) {
    isPlaying = false;
    clearInterval(timerId);
    document.getElementById('control-pads').style.display = 'none';
    const resBox = document.getElementById('result-box');
    const title = document.getElementById('result-title');
    const desc = document.getElementById('result-desc');
    
    resBox.style.display = 'block';
    if (success) {
      title.innerText = '🎉 デトックス成功！';
      desc.innerText = `見事なルート選択で血糖値を正常に保ちました！（最終血糖値: ${glucose}mg/dL）`;
    } else {
      title.innerText = '💥 血糖値スパイク発生…！';
      desc.innerText = glucose >= 250 ? '甘い誘惑に負けて血糖値がオーバーしました！' : 'タイムアップ！時間切れです。';
    }
  }

  // 初回起動
  initGame();
</script>
