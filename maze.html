<div class="game-card">
    <h1>🏃‍♂️ 血糖値デトックス迷路</h1>
    <p>フタマタの道を選んで、甘い誘惑（🍩）を避けながらゴール（🥗）を目指そう！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">🧍‍♂️🔀🥗</div>
        <button class="btn start-btn" onclick="startGame()">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">30.0</span>秒</div>
            <div>血糖値: <span id="glucose">100</span>mg/dL</div>
        </div>
        
        <!-- 迷路ステージ -->
        <div id="maze-container"></div>

        <!-- 十字キー -->
        <div class="controls">
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" onclick="movePlayer(0, -1)">⬆️</button>
            <div class="ctrl-btn empty"></div>
            <button class="ctrl-btn" onclick="movePlayer(-1, 0)">⬅️</button>
            <button class="ctrl-btn" onclick="movePlayer(0, 1)">⬇️</button>
            <button class="ctrl-btn" onclick="movePlayer(1, 0)">➡️</button>
        </div>
        <p style="font-size:0.8rem; color:#888;">分岐で安全な道を選ぼう！</p>
    </div>

    <!-- 結果画面 -->

        <h2 id="result-title" style="color: #8e44ad; font-size: 1.2rem;">✨ デトックス成功！</h2>
        
        <div id="result-message" style="font-size: 1rem; margin: 15px 0; color: #333; line-height: 1.6;"></div>

       <!-- ボタンを格納するエリア -->
<div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;">

    <!-- 1段目：「もう一度あそぶ」＆「クイズ選択に戻る」を横並び -->
    <div style="display: flex; gap: 8px; width: 100%;">
        <button onclick="restartQuiz()" style="flex: 1; padding: 12px 5px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-sizing: border-box;">

        </button>
        <a href="kuizu.html" style="flex: 1; display: block; padding: 12px 5px; background: #7f8c8d; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
            クイズ選択に戻る
        </a>
    </div>

    <!-- 2段目：「ゲーム選択に戻る」＆「トップに戻る」を横並びにする場合 -->
    <div style="display: flex; gap: 8px; width: 100%;">
        <!-- ゲーム選択のページ（例: ミニゲーム一覧など）へのリンク -->
        <a href="game.html" style="flex: 1; display: block; padding: 12px 5px; background: #e67e22; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
            🎮 ゲーム選択に戻る
        </a>
        <a href="index.html" style="flex: 1; display: block; padding: 12px 5px; background: #95a5a6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
            🏠 トップに戻る
        </a>
    </div>

</div>

<script>
    const rows = 11;
    const cols = 11;
    let maze = [];
    let pX = 1, pY = 1;
    let gX = 9, gY = 9;
    let glucose = 100;
    let timeLeft = 30.0;
    let timerInterval = null;
    let isPlaying = false;
    let traps = [];

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        glucose = 100;
        timeLeft = 30.0;
        document.getElementById('glucose').innerText = glucose;
        document.getElementById('timer').innerText = timeLeft.toFixed(1);

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        generateMazeWithFumata();
        updateView();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'maze_game'});
        }

        timerInterval = setInterval(() => {
            if (!isPlaying) return;
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame(false, "タイムアップ！時間切れです。");
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);
        }, 100);
    }

    // フタマタ分岐（複数ルート）を生み出す迷路自動生成
    function generateMazeWithFumata() {
        // 全体を壁で初期化
        maze = Array(rows).fill(0).map(() => Array(cols).fill(1));
        
        // 穴掘り法ベース
        function carve(x, y) {
            maze[y][x] = 0;
            const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]].sort(() => Math.random() - 0.5);
            for (let [dx, dy] of dirs) {
                let nx = x + dx, ny = y + dy;
                if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && maze[ny][nx] === 1) {
                    maze[y + dy / 2][x + dx / 2] = 0;
                    carve(nx, ny);
                }
            }
        }
        carve(1, 1);

        // ★ フタマタ（分岐）を増やすため、ランダムな壁をいくつか壊してループや選択肢を作る
        for (let i = 0; i < 6; i++) {
            let rx = Math.floor(Math.random() * (cols - 2)) + 1;
            let ry = Math.floor(Math.random() * (rows - 2)) + 1;
            maze[ry][rx] = 0;
        }
        
        pX = 1; pY = 1;
        maze[pY][pX] = 0;
        
        gX = cols - 2;
        gY = rows - 2;
        maze[gY][gX] = 0;
        maze[gY-1][gX] = 0;
        maze[gY][gX-1] = 0;

        // 罠（甘い誘惑 🍩）を分岐の要所にランダム配置
        traps = [];
        while (traps.length < 5) {
            let tx = Math.floor(Math.random() * (cols - 2)) + 1;
            let ty = Math.floor(Math.random() * (rows - 2)) + 1;
            if (maze[ty][tx] === 0 && !(tx === 1 && ty === 1) && !(tx === gX && ty === gY)) {
                if (!traps.some(t => t.x === tx && t.y === ty)) {
                    traps.push({x: tx, y: ty});
                }
            }
        }
    }

    function movePlayer(dx, dy) {
        if (!isPlaying) return;
        let nx = pX + dx;
        let ny = pY + dy;
        
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && maze[ny][nx] === 0) {
            pX = nx;
            pY = ny;
            
            let trapIndex = traps.findIndex(t => t.x === pX && t.y === pY);
            if (trapIndex !== -1) {
                glucose += 40;
                traps.splice(trapIndex, 1);
                if (navigator.vibrate) navigator.vibrate(40);
                if (glucose >= 250) {
                    endGame(false, "フタマタの道で甘い誘惑を踏んでしまい、血糖値スパイク発生…！");
                    return;
                }
            } else {
                glucose = Math.max(80, glucose - 1);
            }
            
            if (pX === gX && pY === gY) {
                endGame(true, "賢いルート選択でフタマタを突破し、血糖値を正常に保ちました！");
            } else {
                updateView();
            }
        }
    }

    function updateView() {
        const container = document.getElementById('maze-container');
        container.innerHTML = '';
        document.getElementById('glucose').innerText = glucose;

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                if (x === pX && y === pY) {
                    cell.innerText = '🧍‍♂️';
                } else if (x === gX && y === gY) {
                    cell.innerText = '🥗';
                } else if (traps.some(t => t.x === x && t.y === y)) {
                    cell.innerText = '🍩';
                } else if (maze[y][x] === 1) {
                    cell.className += ' wall';
                } else {
                    cell.className += ' path';
                }
                container.appendChild(cell);
            }
        }
    }

    function endGame(success, message) {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);

        if (navigator.vibrate) {
            navigator.vibrate(success ? [100, 50, 100] : 200);
        }

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let titleElem = document.getElementById('result-title');
        titleElem.innerText = success ? "✨ デトックス成功！" : "💥 血糖値オーバー…！";

        document.getElementById('result-message').innerHTML = '<div style="font-size:2.5rem; margin:5px 0;">' + (success ? '🥗✨' : '🍩💦') + '</div>残りの時間： <b>' + timeLeft.toFixed(1) + ' 秒</b><br>最終血糖値： <b>' + glucose + ' mg/dL</b><br><br>' + message;

        var text = encodeURIComponent('フタマタ分岐の血糖値デトックス迷路をクリアしました！（残り時間: ' + timeLeft.toFixed(1) + '秒）\nあなたも安全なルートを選べる？👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/maze.html') + '&hashtags=皓一部屋,血糖値,健康エンタメ,名古屋マッサージ';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'maze_game', 'success': success, 'time_left': timeLeft});
        }
    }
</script>
