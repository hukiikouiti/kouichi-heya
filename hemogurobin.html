<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HbA1c 改善大作戦 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #c73650;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #c73650;
        }
        /* ゲームステージ（落下型） */
        .game-stage {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            border: 3px solid #c73650;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 上から落ちてくるアイテム */
        .falling-item {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s linear;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .start-btn {
            background-color: #c73650;
            color: #fff;
            border-radius: 30px;
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🩺 HbA1c 改善大作戦</h1>
    <p>制限時間20秒！上から落ちてくる野菜や肉をキャッチしてHbA1cを5.5%まで下げよう！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">🥦🥩</div>
        <button class="btn start-btn" onclick="startGame()">作戦スタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">20.0</span>秒</div>
            <div>HbA1c: <span id="hba1c-val">7.2</span>%</div>
        </div>
        
        <div class="game-stage" id="game-stage"></div>
        <p style="font-size:0.8rem; color:#888;">落ちてくる野菜（🥦）や肉（🥩）をタップしてキャッチ！</p>
    </div>

    <!-- 結果画面（お医者さん・専門家の診断コメント付き） -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #c73650; font-size: 1.2rem;">👨‍⚕️ 医師の定期健診コメント</h2>
        
        <div id="result-message" style="font-size: 0.9rem; margin: 15px 0; color: #333; line-height: 1.6; text-align: left; background: #fff3f5; padding: 12px; border-radius: 10px; border-left: 5px solid #c73650;"></div>

        <a href="https://lin.ee/7Lb96Ev" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #06c755, #05b34c); color: #fff;">🟢 LINEお友達追加</a>
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #27ae60, #219653); color: #fff;">📅 予約する（空き状況確認・ご予約）</a>
        <a id="share-link" target="_blank" class="game-link-btn" style="background: #000; color: #fff; font-size: 0.95rem;">𝕏 で結果をシェアする</a>

        <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 12px; box-sizing: border-box;">
            <button onclick="startGame()" style="background: #c73650; color: #fff; flex: 1; padding: 14px 10px; border-radius: 14px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.95rem;">もう一度挑戦する</button>
            <a href="game.html" style="background: #95a5a6; color: #fff; flex: 1; padding: 14px 10px; border-radius: 14px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.95rem;">ゲーム選択に戻る</a>
        </div>

        <a href="index.html" class="game-link-btn" style="background: #7f8c8d; color: #fff; font-size: 0.95rem; margin-bottom: 0;">🏠 トップに戻る</a>
    </div>
</div>

<script>
    let currentHbA1c = 7.2;
    let timeLeft = 20.0;
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        currentHbA1c = 7.2;
        timeLeft = 20.0;
        document.getElementById('timer').innerText = '20.0';
        document.getElementById('hba1c-val').innerText = currentHbA1c.toFixed(1);

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'hba1c_game'});
        }

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);
        }, 100);

        spawnerInterval = setInterval(spawnItem, 500);
    }

    function spawnItem() {
        if (!isPlaying) return;
        const stage = document.getElementById('game-stage');
        
        const item = document.createElement('div');
        item.className = 'falling-item';

        const rand = Math.random();
        let itemType = 'veg';
        if (rand < 0.5) {
            item.innerHTML = '🥦';
            itemType = 'veg';
        } else if (rand < 0.8) {
            item.innerHTML = '🥩';
            itemType = 'meat';
        } else {
            item.innerHTML = '🍩';
            itemType = 'sweet';
        }
        item.dataset.type = itemType;

        const maxX = stage.clientWidth - 50;
        const randomX = Math.floor(Math.random() * Math.max(0, maxX));
        item.style.left = randomX + 'px';
        item.style.top = '-50px';

        let posY = -50;
        const fallSpeed = 2.0 + Math.random() * 2.0;

        const fallInterval = setInterval(() => {
            if (!isPlaying) {
                clearInterval(fallInterval);
                item.remove();
                return;
            }

            posY += fallSpeed;
            item.style.top = posY + 'px';

            if (posY > stage.clientHeight) {
                clearInterval(fallInterval);
                item.remove();
            }
        }, 30);

        item.onmousedown = item.ontouchstart = (e) => {
            e.preventDefault();
            if (!isPlaying) return;

            clearInterval(fallInterval);

            if (item.dataset.type === 'veg' || item.dataset.type === 'meat') {
                currentHbA1c = Math.max(5.5, currentHbA1c - 0.1);
                if (navigator.vibrate) navigator.vibrate(30);
            } else {
                currentHbA1c = Math.min(9.0, currentHbA1c + 0.2);
                if (navigator.vibrate) navigator.vibrate(50);
            }

            document.getElementById('hba1c-val').innerText = currentHbA1c.toFixed(1);
            item.remove();

            if (currentHbA1c <= 5.5) {
                endGame();
            }
        };

        stage.appendChild(item);
    }

    function clearItems() {
        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        clearInterval(spawnerInterval);
        clearItems();

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100]);
        }

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let judge = "";
        let doctorComment = "";

        if (currentHbA1c <= 5.5) {
            judge = "【理想の数値達成！ヘモグロビンマスター】";
            doctorComment = "「素晴らしい数値ですね！完璧な食事管理とセルフケアの賜物です。この調子で身体のメンテナンスを続けていきましょう！」";
        } else if (currentHbA1c <= 6.2) {
            judge = "【改善傾向あり！健康優良生】";
            doctorComment = "「良い傾向が見られますね。あともう一歩で理想の領域です。日頃のストレッチや食習慣の意識をさらに高めていきましょう。」";
        } else {
            judge = "【甘い誘惑に負けた生活習慣】";
            doctorComment = "「おや、少し数値が高めに出ていますね……！ 甘いものの食べ過ぎには注意が必要です。しっかり身体をほぐして代謝を上げていきましょう！」";
        }

        document.getElementById('result-message').innerHTML = '<b>最終HbA1c： ' + currentHbA1c.toFixed(1) + ' %</b><br><span style="color:#c73650; font-weight:bold;">' + judge + '</span><br><br><b>👨‍⚕️ 担当医からのコメント：</b><br>' + doctorComment;

        var text = encodeURIComponent('HbA1c改善大作戦で最終数値 ' + currentHbA1c.toFixed(1) + '% を達成しました！\n称号：' + judge + '\n\n健康管理のエンタメゲーム、あなたも挑戦してみる？👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/hemogurobin.html') + '&hashtags=皓一部屋,HbA1c,健康エンタメ,名古屋マッサージ';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'hba1c_game', 'score': currentHbA1c});
        }
    }
</script>

</body>
</html>
