<script>
    let currentHbA1c = 7.2;
    let timeLeft = 20.0;
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) {
            // すでにプレイ中の場合はタイマーなどをいったんリセットして安全に再スタート
            clearInterval(timerInterval);
            clearInterval(spawnerInterval);
            isPlaying = false;
        }
        
        isPlaying = true;
        currentHbA1c = 7.2;
        timeLeft = 20.0;
        document.getElementById('timer').innerText = '20.0';
        document.getElementById('hba1c-val').innerText = currentHbA1c.toFixed(1);

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'hba1c_game'});
        }

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;

                endGame();
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);
        }, 100);

        spawnerInterval = setInterval(spawnItem, 500);
    }
