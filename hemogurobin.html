
<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HbA1c改善大作戦 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a2e;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #e94560;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #0288d1;
        }
        /* HbA1cメーターの外枠 */
        .meter-container {
            width: 100%;
            background-color: #eee;
            border-radius: 10px;
            height: 22px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 2px solid #e94560;
            position: relative;
        }
        /* HbA1cメーターの中身（バー） */
        .meter-bar {
            width: 83.3%; /* 初期値7.5%の位置 (8.0~5.0の幅に対する割合) */
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #f39c12, #e94560);
            transition: width 0.1s linear;
        }
        .meter-text {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            line-height: 18px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
        /* ゲームステージ */
        .game-stage {
            width: 100%;
            height: 260px;
            background: linear-gradient(135deg, #1f4068 0%, #162447 100%);
            border: 3px solid #e94560;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }
        /* 落ちてくるオブジェクト */
        .falling-item {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s linear;
        }
        /* ポップアップ文字 */
        .popup-msg {
            position: absolute;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
            z-index: 10;
        }
        .popup-good { color: #fff; background: rgba(39, 174, 96, 0.9); border: 1px solid #a3e4d7; }
        .popup-bad { color: #fff; background: rgba(233, 69, 96, 0.9); border: 1px solid #f5b7b1; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-35px) scale(1.1); }
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .start-btn {
            background-color: #e94560;
            color: #fff;
            border-radius: 30px;
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🩺 HbA1c 改善大作戦</h1>
    <p>制限時間20秒！野菜や肉（🥗🥩）を取ってHbA1cを5.5%まで下げよう！甘い誘惑（🍩🍰）は数値が上がるので避けろ！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">🥗📉</div>
        <button class="btn start-btn" onclick="startGame()">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">20</span>秒</div>
            <div>取った野菜・肉: <span id="score-count">0</span> / 20個</div>
        </div>
        
        <!-- HbA1cメーター (8.0% 〜 5.0%) -->
        <div class="meter-container">
            <div id="meter-bar" class="meter-bar"></div>
            <div id="meter-text" class="meter-text">HbA1c: 7.5%</div>
        </div>

        <!-- ゲームステージ -->
        <div class="game-stage" id="game-stage"></div>
        <p style="font-size:0.8rem; color:#888;">野菜や肉をタップして数値を下げろ！</p>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #e94560; font-size: 1.2rem;">👨‍⚕️ お医者さんの判定</h2>
        
        <!-- 結果メッセージ表示用 -->
        <div id="result-message" style="font-size: 0.95rem; margin: 15px 0; color: #333; line-height: 1.6; text-align: left; background: #f8f9fa; padding: 12px; border-radius: 10px; border-left: 4px solid #e94560;"></div>

        <!-- 1列目：LINEお友達追加（太ボタン） -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #06c755, #05b34c); color: #fff;">🟢 LINEお友達追加</a>

        <!-- 2列目：予約する（太ボタン） -->
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #27ae60, #219653); color: #fff;">📅 予約する（空き状況確認・ご予約）</a>

        <!-- 3列目：Xで結果をシェア -->
        <a id="share-link" target="_blank" class="game-link-btn" style="background: #000; color: #fff;">𝕏 で結果をシェアする</a>

        <!-- 4列目：もう一度あそぶ ＆ ゲーム選択に戻る -->
        <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 12px; box-sizing: border-box;">
            <button onclick="startGame()" style="background: #e94560; color: #fff; flex: 1; padding: 14px 10px; border-radius: 14px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.95rem;">もう一度あそぶ</button>
            <a href="game.html" style="background: #95a5a6; color: #fff; flex: 1; padding: 14px 10px; border-radius: 14px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.95rem;">ゲーム選択に戻る</a>
        </div>

        <!-- 5列目：トップに戻る -->
        <a href="index.html" class="game-link-btn" style="background: #7f8c8d; color: #fff;">🏠 トップに戻る</a>
    </div>
</div>

<script>
    let hba1c = 7.5; // 初期値 7.5%
    let timeLeft = 20; // 制限時間 20秒
    let goodCount = 0; // 取った野菜・肉の数
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        hba1c = 7.5;
        timeLeft = 20;
        goodCount = 0;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('score-count').innerText = goodCount;
        updateMeter();

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'hba1c_game'});
        }

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);

        spawnerInterval = setInterval(spawnItem, 550);
    }

    function spawnItem() {
        if (!isPlaying) return;
        const stage = document.getElementById('game-stage');
        
        const item = document.createElement('div');
        item.className = 'falling-item';

        const rand = Math.random();
        let itemType = 'good';
        let valChange = -0.1;

        if (rand < 0.4) {
            item.innerHTML = '🥗';
            itemType = 'good';
            valChange = -0.1;
        } else if (rand < 0.7) {
            item.innerHTML = '🥩';
            itemType = 'good';
            valChange = -0.1;
        } else if (rand < 0.85) {
            item.innerHTML = '🍩';
            itemType = 'bad';
            valChange = +0.1;
        } else {
            item.innerHTML = '🍰';
            itemType = 'bad';
            valChange = +0.1;
        }
        item.dataset.type = itemType;
        item.dataset.val = valChange;

        const maxX = stage.clientWidth - 50;
        const randomX = Math.floor(Math.random() * Math.max(0, maxX));
        item.style.left = randomX + 'px';
        item.style.top = '-50px';

        let posY = -50;
        const fallSpeed = 2.0 + Math.random() * 2.2;

        const fallInterval = setInterval(() => {
            if (!isPlaying) {
                clearInterval(fallInterval);
                item.remove();
                return;
            }

            posY += fallSpeed;
            item.style.top = posY + 'px';

            if (posY > stage.clientHeight) {
                clearInterval(fallInterval);
                item.remove();
            }
        }, 30);

        item.onmousedown = item.ontouchstart = (e) => {
            e.preventDefault();
            if (!isPlaying) return;

            clearInterval(fallInterval);

            const rect = stage.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const change = parseFloat(item.dataset.val);
            hba1c = Math.round((hba1c + change) * 10) / 10;
            
            // 範囲制限（8.0% 〜 5.0%）
            if (hba1c > 8.0) hba1c = 8.0;
            if (hba1c < 5.0) hba1c = 5.0;

            if (item.dataset.type === 'good') {
                goodCount++;
                if (navigator.vibrate) navigator.vibrate(40);
                showPopup(clientX - rect.left, clientY - rect.top, '-0.1% 📉', 'popup-good', stage);
            } else {
                if (navigator.vibrate) navigator.vibrate(60);
                showPopup(clientX - rect.left, clientY - rect.top, '+0.1% 📈', 'popup-bad', stage);
            }

            document.getElementById('score-count').innerText = goodCount;
            updateMeter();
            item.remove();

            // 5.5%以下に到達したらその場でクリア！
            if (hba1c <= 5.5) {
                endGame();
            }
        };

        stage.appendChild(item);
    }

    function updateMeter() {
        // 8.0%が0%、5.0%が100%になるバーの計算 (全幅3.0%)
        const percentage = ((8.0 - hba1c) / 3.0) * 100;
        document.getElementById('meter-bar').style.width = Math.max(0, Math.min(100, percentage)) + '%';
        document.getElementById('meter-text').innerText = 'HbA1c: ' + hba1c.toFixed(1) + '%';
    }

    function showPopup(x, y, text, className, stage) {
        const popup = document.createElement('div');
        popup.className = `popup-msg ${className}`;
        popup.innerText = text;
        popup.style.left = Math.max(10, x - 20) + 'px';
        popup.style.top = Math.max(10, y - 20) + 'px';

        stage.appendChild(popup);
        setTimeout(() => popup.remove(), 500);
    }

    function clearItems() {
        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        clearInterval(spawnerInterval);
        clearItems();

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100]);
        }

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let judgeMsg = "";
        let titleText = "";

        if (hba1c <= 5.5) {
            titleText = "🎉 クリア！お医者さんの判定";
            judgeMsg = `最終HbA1c： <b>${hba1c.toFixed(1)}%</b>（目標達成！）<br><br>👨‍⚕️ <strong>「素晴らしい！HbA1cがしっかり正常値まで下がっていますね！この調子で食事管理をキープしてください！」</strong>`;
        } else {
            titleText = "💥 ゲームオーバー…お医者さんの判定";
            judgeMsg = `最終HbA1c： <b>${hba1c.toFixed(1)}%</b>（まだ高め…）<br><br>👨‍⚕️ <strong>「……数値、全然下がっていませんね？ 一体最近何を食べたんですか！？」</strong>`;
        }

        document.getElementById('result-title').innerText = titleText;
        document.getElementById('result-message').innerHTML = judgeMsg;

        var text = encodeURIComponent('HbA1c改善大作戦に挑戦しました！\n最終HbA1c： ' + hba1c.toFixed(1) + '%\n\nあなたも血糖コントロールに挑戦してみる？👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/hemogrobin.html') + '&hashtags=皓一部屋,HbA1c,健康エンタメ,名古屋マッサージ';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'hba1c_game', 'hba1c': hba1c});
        }
    }
</script>

</body>
</html>
