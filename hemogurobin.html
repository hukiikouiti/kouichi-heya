<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>糖質オフ・バランス大作戦 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #27ae60;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #27ae60;
        }
        /* ゲームステージ（落下型） */
        .game-stage {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #e8f8f5 0%, #d1f2eb 100%);
            border: 3px solid #27ae60;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 上から落ちてくるアイテム */
        .falling-item {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s linear;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .start-btn {
            background-color: #27ae60;
            color: #fff;
            border-radius: 30px;
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🥗 糖質オフ・バランス大作戦</h1>
    <p>制限時間20秒！上から落ちてくる野菜や肉をキャッチしてバランス値を5.5%まで下げよう！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">🥦🥩</div>
        <button class="btn start-btn" onclick="startGame()">作戦スタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">20.0</span>秒</div>
            <div>バランス値: <span id="balance-val">7.2</span>%</div>
        </div>
        
        <div class="game-stage" id="game-stage"></div>
        <p style="font-size:0.8rem; color:#888;">落ちてくる野菜（🥦）や肉（🥩）をタップしてキャッチ！</p>
    </div>

    <!-- 結果画面（コーチのアドバイス付き） -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #27ae60; font-size: 1.2rem;">💡 コンディショニング結果</h2>
        
        <div id="result-message" style="font-size: 0.9rem; margin: 15px 0; color: #333; line-height: 1.6; text-align: left; background: #e8f8f5; padding: 12px; border-radius: 10px; border-left: 5px solid #27ae60;"></div>

        <!-- 1列目：LINEお友達追加 -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #06c755, #05b34c); color: #fff;">🟢 LINEお友達追加</a>

        <!-- 2列目：予約する -->
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #27ae60, #219653); color: #fff;">📅 予約する（空き状況確認・ご予約）</a>

        <!-- 3列目：Xで結果をシェア -->
        <a id="share-link" href="#" target="_blank" class="game-link-btn" style="background: #000; color: #fff; text-align: center;">𝕏 で結果をシェアする</a>

        <!-- ボタンを格納するエリア -->
        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;">

            <!-- 1段目：「もう一度あそぶ」＆「クイズ選択に戻る」 -->
            <div style="display: flex; gap: 8px; width: 100%;">
                <button onclick="startGame()" style="flex: 1; padding: 12px 5px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-sizing: border-box;">
                    もう一度あそぶ
                </button>
                <a href="kuizu.html" style="flex: 1; display: block; padding: 12px 5px; background: #7f8c8d; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    クイズ選択に戻る
                </a>
            </div>

            <!-- 2段目：「ゲーム選択に戻る」＆「トップに戻る」 -->
            <div style="display: flex; gap: 8px; width: 100%;">
                <a href="game.html" style="flex: 1; display: block; padding: 12px 5px; background: #e67e22; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    🎮 ゲーム選択に戻る
                </a>
                <a href="index.html" style="flex: 1; display: block; padding: 12px 5px; background: #95a5a6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    🏠 トップに戻る
                </a>
            </div>

        </div>
    </div>
    
    <!-- フッタークレジット表記 -->
    <div style="margin-top: 20px; font-size: 0.75rem; color: #888; border-top: 1px solid #eee; padding-top: 10px;">
        © 2026 皓一部屋. All Rights Reserved.
    </div>
</div>

<script>
    let currentBalance = 7.2;
    let timeLeft = 20.0;
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) {
            clearInterval(timerInterval);
            clearInterval(spawnerInterval);
            isPlaying = false;
        }
        
        isPlaying = true;
        currentBalance = 7.2;
        timeLeft = 20.0;
        document.getElementById('timer').innerText = '20.0';
        document.getElementById('balance-val').innerText = currentBalance.toFixed(1);

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'diet_balance_game'});
        }

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);
        }, 100);

        spawnerInterval = setInterval(spawnItem, 500);
    }

    function spawnItem() {
        if (!isPlaying) return;
        const stage = document.getElementById('game-stage');
        
        const item = document.createElement('div');
        item.className = 'falling-item';

        const rand = Math.random();
        let itemType = 'veg';
        if (rand < 0.5) {
            item.innerHTML = '🥦';
            itemType = 'veg';
        } else if (rand < 0.8) {
            item.innerHTML = '🥩';
            itemType = 'meat';
        } else {
            item.innerHTML = '🍩';
            itemType = 'sweet';
        }
        item.dataset.type = itemType;

        const maxX = stage.clientWidth - 50;
        const randomX = Math.floor(Math.random() * Math.max(0, maxX));
        item.style.left = randomX + 'px';
        item.style.top = '-50px';

        let posY = -50;
        const fallSpeed = 2.0 + Math.random() * 2.0;

        const fallInterval = setInterval(() => {
            if (!isPlaying) {
                clearInterval(fallInterval);
                item.remove();
                return;
            }

            posY += fallSpeed;
            item.style.top = posY + 'px';

            if (posY > stage.clientHeight) {
                clearInterval(fallInterval);
                item.remove();
            }
        }, 30);

        item.onmousedown = item.ontouchstart = (e) => {
            e.preventDefault();
            if (!isPlaying) return;

            clearInterval(fallInterval);

            if (item.dataset.type === 'veg' || item.dataset.type === 'meat') {
                currentBalance = Math.max(5.5, currentBalance - 0.1);
                if (navigator.vibrate) navigator.vibrate(30);
            } else {
                currentBalance = Math.min(9.0, currentBalance + 0.2);
                if (navigator.vibrate) navigator.vibrate(50);
            }

            document.getElementById('balance-val').innerText = currentBalance.toFixed(1);
            item.remove();

            if (currentBalance <= 5.5) {
                endGame();
            }
        };

        stage.appendChild(item);
    }

    function clearItems() {
        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        clearInterval(spawnerInterval);
        clearItems();

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100]);
        }

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let judge = "";
        let coachComment = "";

        if (currentBalance <= 5.5) {
            judge = "【理想のバランス達成！コンディショニングマスター】";
            coachComment = "「素晴らしいスコアですね！日頃の食事意識とボディケアの相乗効果がバッチリ出ています。この軽やかな調子を維持していきましょう！」";
        } else if (currentBalance <= 6.2) {
            judge = "【順調なコンディション維持！健康優良生】";
            coachComment = "「良い傾向が見られますね。あともう一歩で理想のバランス領域です。日頃のストレッチや生活リズムの意識をさらに高めていきましょう。」";
        } else {
            judge = "【甘い誘惑に負けたスッキリ不足】";
            coachComment = "「おや、少し甘いものに偏ってしまいましたね……！ バランスの良い食事と、しっかり身体をほぐして代謝を上げるケアを取り入れていきましょう！」";
        }

        document.getElementById('result-message').innerHTML = '<b>最終バランス値： ' + currentBalance.toFixed(1) + ' %</b><br><span style="color:#27ae60; font-weight:bold;">' + judge + '</span><br><br><b>💡 コーチからのアドバイス：</b><br>' + coachComment;

        var text = encodeURIComponent('糖質オフ・バランス大作戦で最終値 ' + currentBalance.toFixed(1) + '% を達成しました！\n称号：' + judge + '\n\n健康ボディメイクゲーム、あなたも挑戦してみる？👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/hemogurobin.html') + '&hashtags=皓一部屋,糖質オフ,健康エンタメ,名古屋マッサージ';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'diet_balance_game', 'score': currentBalance});
        }
    }
</script>

</body>
</html>
