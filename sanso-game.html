    <meta charset="UTF-8">

    <title>活性酸素 20秒バトル＆リセット道場 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 15px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 100%;
            width: 380px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: #b8860b;
        }
        p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #d4af37;
        }
        /* メーター */
        #meter-container {
            width: 100%;
            background: #444;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            box-sizing: border-box;
            border: 2px solid #666;
            margin-bottom: 8px;
        }
        #meter-bar {
            width: 50%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.2s;
        }
        /* ゲームステージ */
        .game-stage {
            width: 100%;
            height: 220px;
            background: #1a1a1a;
            border: 3px solid #d4af37;
            border-radius: 14px;
            position: relative;
            margin: 0 auto 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        .phase-indicator {
            font-size: 0.95rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
        }
        .action-main-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 110px;
            height: 110px;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.5);
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }
        .action-main-btn:active {
            transform: scale(0.92);
        }
        .action-main-btn.defense-mode {
            background: linear-gradient(135deg, #27ae60, #219653);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.5);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .start-btn {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff;
            border-radius: 30px;
            font-size: 1.05rem;
            padding: 15px 0;
        }
        .share-btn { background-color: #000000; color: #fff; }
        .line-btn { background: linear-gradient(135deg, #06c755, #05b34c); color: #fff; }
        .reserve-btn { background: linear-gradient(135deg, #27ae60, #219653); color: #fff; }
        .hidden { display: none !important; }
        .back-link {
            display: block;
            margin-top: 10px;
            color: #3498db;
            font-size: 0.8rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<div class="game-card">
    <h1>🧬 活性酸素 20秒バトル道場</h1>
    <p>前半20秒は「免疫としての攻撃」、後半20秒は「抗酸化による回復」を連打でこなそう！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3rem; margin: 10px 0;">⚡🛡️</div>
        <button id="start-btn" class="btn start-btn">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">40</span>秒</div>
            <div>撃退スコア: <span id="score-count">0</span></div>
        </div>
        <div style="font-size: 0.75rem; color: #ff4757; font-weight: bold; margin-bottom: 2px;">活性酸素バランス (<span id="sugar-text">50</span>%)</div>
        <div id="meter-container">
            <div id="meter-bar" style="width: 50%;"></div>
        </div>
        
        <!-- ゲームステージ（連打ボタンエリア） -->
        <div class="game-stage" id="game-stage">
            <div id="phase-title" class="phase-indicator">前半：免疫の攻撃タイム！</div>
            <button id="action-tap-btn" class="action-main-btn">ウイルス攻撃！</button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #b8860b; font-size: 1.1rem;">✨ バトル終了！</h2>
        <div id="result-message" style="font-size: 0.85rem; margin: 10px 0; color: #333; line-height: 1.5; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px;"></div>

        <!-- 予約・外部導線（名古屋めし防衛戦と同等のボタン群） -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" rel="noopener noreferrer" class="game-link-btn line-btn">🟢 LINEお友達追加</a>
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" rel="noopener noreferrer" class="game-link-btn reserve-btn">📅 予約する（空き状況確認・ご予約）</a>
        <a id="share-link" href="#" target="_blank" rel="noopener noreferrer" class="game-link-btn share-btn">𝕏 で結果をシェアする</a>

        <!-- 下部ナビゲーションボタン群 -->
        <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 10px;">
            <div style="display: flex; gap: 8px; width: 100%;">
                <button onclick="startGame()" style="flex: 1; padding: 10px 5px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">
                    もう一度あそぶ
                </button>
                <a href="kuizu.html" style="flex: 1; display: block; padding: 10px 5px; background: #7f8c8d; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; line-height: 1.4;">
                    クイズ選択に戻る
                </a>
            </div>
            <div style="display: flex; gap: 8px; width: 100%;">
                <a href="game.html" style="flex: 1; display: block; padding: 10px 5px; background: #e67e22; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; line-height: 1.4;">
                    🎮 ゲーム選択に戻る
                </a>
                <a href="index.html" style="flex: 1; display: block; padding: 10px 5px; background: #95a5a6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; line-height: 1.4;">
                    🏠 トップに戻る
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    let timeLeft = 40;
    let isPlaying = false;
    let score = 0;
    let oxygen = 50; // 活性酸素メーター (0〜100)
    let timerInterval = null;
    let currentPhase = 1; // 1: 前半攻撃 (0〜20秒), 2: 後半回復 (21〜40秒)

    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                startGame();
            });
        }

        const actionBtn = document.getElementById('action-tap-btn');
        actionBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isPlaying) return;
            handleGameAction();
        });
    });

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        timeLeft = 40;
        score = 0;
        oxygen = 50;
        currentPhase = 1;

        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('score-count').innerText = score;
        document.getElementById('sugar-text').innerText = oxygen;
        document.getElementById('meter-bar').style.width = oxygen + '%';

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        updatePhaseUI();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'sanso_game'});
        }

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;

            // 20秒経過で後半（回復フェーズ）に切り替え
            if (timeLeft === 20) {
                currentPhase = 2;
                updatePhaseUI();
            }

            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function updatePhaseUI() {
        const phaseTitle = document.getElementById('phase-title');
        const actionBtn = document.getElementById('action-tap-btn');
        const meterBar = document.getElementById('meter-bar');

        if (currentPhase === 1) {
            phaseTitle.innerText = "前半：免疫の攻撃タイム！";
            phaseTitle.style.color = "#e74c3c";
            actionBtn.innerText = "ウイルス攻撃！";
            actionBtn.classList.remove('defense-mode');
        } else {
            phaseTitle.innerText = "後半：抗酸化・休息の回復タイム！";
            phaseTitle.style.color = "#27ae60";
            actionBtn.innerText = "深呼吸で回復！";
            actionBtn.classList.add('defense-mode');
        }
    }

    function handleGameAction() {
        if (currentPhase === 1) {
            // 前半：攻撃（スコアアップ、活性酸素も少し増加）
            score++;
            oxygen = Math.min(100, oxygen + 1.5);
        } else {
            // 後半：回復・抗酸化（活性酸素を減らす）
            oxygen = Math.max(0, oxygen - 2.5);
        }

        document.getElementById('score-count').innerText = score;
        document.getElementById('sugar-text').innerText = Math.round(oxygen);
        document.getElementById('meter-bar').style.width = oxygen + '%';
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let titleText = "";
        let messageText = "";

        // 3エンド判定（最終的な活性酸素の数値とスコアで判定）
        if (oxygen <= 40 && score >= 15) {
            titleText = "🎉 【ハッピーエンド】ベストコンディション！";
            messageText = "<b>【結果判定：理想的なバランス】</b><br>免疫の働きを上手に活かしつつ、抗酸化ケアも完璧に行えました！あなたの体内バランスは常に最高状態です。この調子で日々のメンテナンスをさらに高めましょう！";
        } else if (oxygen > 40 && oxygen <= 75) {
            titleText = "⚠️ 【普通エンド】ちょっぴりお疲れ気味…";
            messageText = "<b>【結果判定：ややお疲れ・サビ蓄積】</b><br>敵はしっかり倒せましたが、少し活性酸素が溜まって体がサビ気味です。このままでは慢性的なコリやだるさに繋がるかも？日曜午後の深いケアでリセットがおすすめです。";
        } else {
            titleText = "🚨 【バッドエンド】活性酸素が暴走中…！";
            messageText = "<b>【結果判定：暴走・危険信号】</b><br>回復が追いつかず、活性酸素が暴走して体がカチコチになっています。睡眠の質低下や腰の重さに悩まされる危険信号です。深部からの徹底デトックスが必要です！";
        }

        document.getElementById('result-title').innerText = titleText;
        document.getElementById('result-message').innerHTML = messageText + '<br><br>討伐スコア： <b>'+ score +' 回</b><br>最終活性酸素量： <b>'+ Math.round(oxygen) +'%</b>';

        var shareText = encodeURIComponent('活性酸素バトル道場でスコア ' + score + ' を記録！最終バランス ' + Math.round(oxygen) + '% でした！\nあなたも体内のサビをリセットしよう！👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodeURIComponent(window.location.href) + '&hashtags=皓一部屋,活性酸素,健康防衛軍';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'sanso_game', 'score': score, 'oxygen': Math.round(oxygen)});
        }
    }
</script>

</body>
</html>
