<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活性酸素 20秒バトル＆呼吸リフレッシュ道場 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 10px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 15px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 100%;
            width: 380px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: #b8860b;
        }
        p {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #d4af37;
        }
        /* メーター */
        #meter-container {
            width: 100%;
            background: #444;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            box-sizing: border-box;
            border: 2px solid #666;
            margin-bottom: 8px;
        }
        #meter-bar {
            width: 50%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.2s;
        }
        /* ゲームステージ */
        .game-stage {
            width: 100%;
            height: 220px;
            background: #1a1a1a;
            border: 3px solid #d4af37;
            border-radius: 14px;
            position: relative;
            margin: 0 auto 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        .phase-indicator {
            font-size: 0.95rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
        }
        .action-main-btn {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 115px;
            height: 115px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.5);
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }
        .action-main-btn:active {
            transform: scale(0.92);
        }
        .action-main-btn.defense-mode {
            background: linear-gradient(135deg, #27ae60, #219653);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.5);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .start-btn {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff;
            border-radius: 30px;
            font-size: 1.05rem;
            padding: 15px 0;
        }
        .share-btn { background-color: #000000; color: #fff; }
        .line-btn { background: linear-gradient(135deg, #06c755, #05b34c); color: #fff; }
        .reserve-btn { background: linear-gradient(135deg, #27ae60, #219653); color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🧬 活性酸素 20秒バトル道場</h1>
    <p>前半は「👾 悪玉ウイルス攻撃（20回達成で即次へ）」、後半は「💨 新鮮な空気で呼吸」を連打しよう！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3rem; margin: 10px 0;">👾⚡ 💨🧘</div>
        <button id="start-btn" class="btn start-btn">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">20</span>秒</div>
            <div><span id="score-label">撃退数</span>: <span id="score-count">0</span></div>
        </div>
        <div style="font-size: 0.75rem; color: #ff4757; font-weight: bold; margin-bottom: 2px;">活性酸素バランス (<span id="sugar-text">50</span>%)</div>
        <div id="meter-container">
            <div id="meter-bar" style="width: 50%;"></div>
        </div>
        
        <!-- ゲームステージ（連打ボタンエリア） -->
        <div class="game-stage" id="game-stage">
            <div id="phase-title" class="phase-indicator">前半：悪玉ウイルスを攻撃！</div>
            <button id="action-tap-btn" class="action-main-btn">
                <span style="font-size: 1.3rem;">👾⚡</span>
                <span id="btn-label" style="font-size: 0.7rem; margin-top: 2px;">稲妻ダメージ</span>
            </button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #b8860b; font-size: 1.1rem;">✨ バトル終了！</h2>
        <div id="result-message" style="font-size: 0.85rem; margin: 10px 0; color: #333; line-height: 1.5; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 8px;"></div>

        <!-- 予約・外部導線 -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" rel="noopener noreferrer" class="game-link-btn line-btn">🟢 LINEお友達追加</a>
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" rel="noopener noreferrer" class="game-link-btn reserve-btn">📅 予約する（空き状況確認・ご予約）</a>
        <a id="share-link" href="#" target="_blank" rel="noopener noreferrer" class="game-link-btn share-btn">𝕏 で結果をシェアする</a>

        <!-- 下部ナビゲーションボタン群 -->
        <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 10px;">
            <div style="display: flex; gap: 8px; width: 100%;">
                <button onclick="startGame()" style="flex: 1; padding: 10px 5px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">
                    もう一度あそぶ
                </button>
                <a href="kuizu.html" style="flex: 1; display: block; padding: 10px 5px; background: #7f8c8d; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; line-height: 1.4;">
                    クイズ選択に戻る
                </a>
            </div>
            <div style="display: flex; gap: 8px; width: 100%;">
                <a href="game.html" style="flex: 1; display: block; padding: 10px 5px; background: #e67e22; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; line-height: 1.4;">
                    🎮 ゲーム選択に戻る
                </a>
                <a href="index.html" style="flex: 1; display: block; padding: 10px 5px; background: #95a5a6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; line-height: 1.4;">
                    🏠 トップに戻る
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    let timeLeft = 20; // 総合20秒スタート
    let isPlaying = false;
    let attackScore = 0; // ウイルス撃退数
    let breathCount = 0; // 呼吸数
    let oxygen = 50; // 活性酸素メーター (0〜100)
    let timerInterval = null;
    let currentPhase = 1; // 1: 前半攻撃, 2: 後半呼吸
    let virusCleared = false; // 20回タップしてウイルスが消えたかどうか

    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                startGame();
            });
        }

        const actionBtn = document.getElementById('action-tap-btn');
        actionBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isPlaying) return;
            handleGameAction();
        });
    });

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        timeLeft = 20;
        attackScore = 0;
        breathCount = 0;
        oxygen = 50;
        currentPhase = 1;
        virusCleared = false;

        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('score-label').innerText = "撃退数";
        document.getElementById('score-count').innerText = attackScore;
        document.getElementById('sugar-text').innerText = oxygen;
        document.getElementById('meter-bar').style.width = oxygen + '%';

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        updatePhaseUI();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'sanso_game_20s'});
        }

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;

            // 残り10秒になるか、あるいは通常のタイマー進行（フォールバック）
            if (timeLeft === 10 && currentPhase === 1) {
                switchToBreathPhase();
            }

            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function switchToBreathPhase() {
        currentPhase = 2;
        virusCleared = false;
        updatePhaseUI();
    }

    function updatePhaseUI() {
        const phaseTitle = document.getElementById('phase-title');
        const actionBtn = document.getElementById('action-tap-btn');
        const scoreLabel = document.getElementById('score-label');

        actionBtn.style.display = "flex"; // ボタンを再表示

        if (currentPhase === 1) {
            phaseTitle.innerText = "前半：👾 悪玉ウイルスを攻撃！（20回で即次へ）";
            phaseTitle.style.color = "#e74c3c";
            scoreLabel.innerText = "撃退数";
            document.getElementById('score-count').innerText = attackScore;
            actionBtn.innerHTML = '<span style="font-size: 1.3rem;">👾⚡</span><span style="font-size: 0.7rem; margin-top: 2px;">稲妻ダメージ</span>';
            actionBtn.classList.remove('defense-mode');
        } else {
            phaseTitle.innerText = "後半：💨 新鮮な空気で呼吸！";
            phaseTitle.style.color = "#27ae60";
            scoreLabel.innerText = "呼吸数";
            document.getElementById('score-count').innerText = breathCount;
            actionBtn.innerHTML = '<span style="font-size: 1.3rem;">💨🧘</span><span style="font-size: 0.7rem; margin-top: 2px;">深呼吸する</span>';
            actionBtn.classList.add('defense-mode');
        }
    }

    function handleGameAction() {
        if (currentPhase === 1) {
            if (virusCleared) return; 
            
            attackScore++;
            oxygen = Math.min(100, oxygen + 2);
            document.getElementById('score-count').innerText = attackScore;

            // ★20回タップ達成でウイルス消滅＆即座に後半の呼吸フェーズへ移行！
            if (attackScore >= 20) {
                virusCleared = true;
                document.getElementById('phase-title').innerText = "✨ ウイルス消滅！呼吸フェーズへ！";
                document.getElementById('action-tap-btn').style.display = "none"; // ボタンをいったん消す
                
                // 0.6秒後に自動で後半（呼吸フェーズ）へ切り替え
                setTimeout(() => {
                    if (isPlaying && currentPhase === 1) {
                        switchToBreathPhase();
                    }
                }, 600);
            }
        } else {
            // 後半：呼吸フェーズ
            breathCount++;
            oxygen = Math.max(0, oxygen - 2);
            document.getElementById('score-count').innerText = breathCount;
        }

        document.getElementById('sugar-text').innerText = Math.round(oxygen);
        document.getElementById('meter-bar').style.width = oxygen + '%';
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let titleText = "";
        let messageText = "";

        // ハッピーエンド・グッドエンド・バッドエンドの判定
        if (oxygen <= 40 && (attackScore >= 15 || virusCleared)) {
            titleText = "🎉 【ハッピーエンド】ベストコンディション達成！";
            messageText = "<b>【判定：ハッピーエンド】</b><br>素晴らしい！悪玉ウイルスを素早く撃退し、新鮮な空気の呼吸数（<b>" + breathCount + "回</b>）で活性酸素のバランスを完璧に整えられました！あなたの体内環境は最高状態です！";
        } else if (oxygen > 40 && oxygen <= 75) {
            titleText = "👍 【グッドエンド】まずまずのリフレッシュ！";
            messageText = "<b>【判定：グッドエンド】</b><br>しっかりウイルスを攻撃し、呼吸数（<b>" + breathCount + "回</b>）でケアできました。少しサビが残っていますが、日常のメンテナンスで十分カバーできます！";
        } else {
            titleText = "🚨 【バッドエンド】活性酸素が優勢…！";
            messageText = "<b>【判定：バッドエンド】</b><br>呼吸によるケア（呼吸数: <b>" + breathCount + "回</b>）が少し足りず、活性酸素が溜まってしまいました…。深いリラクゼーションとデトックスが必要です！";
        }

        document.getElementById('result-title').innerText = titleText;
        document.getElementById('result-message').innerHTML = messageText + '<br><br>ウイルス撃退数： <b>'+ attackScore +' 回</b><br>呼吸数： <b>'+ breathCount +' 回</b><br>最終活性酸素量： <b>'+ Math.round(oxygen) +'%</b>';

        var shareText = encodeURIComponent('活性酸素20秒バトル道場をクリア！呼吸数 ' + breathCount + '回、最終バランス ' + Math.round(oxygen) + '% でした！\nあなたも体内のサビをリセットしよう！👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodeURIComponent(window.location.href) + '&hashtags=皓一部屋,活性酸素,健康防衛軍';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'sanso_game_20s', 'attack_score': attackScore, 'breath_count': breathCount, 'oxygen': Math.round(oxygen)});
        }
    }
</script>

</body>
</html>
