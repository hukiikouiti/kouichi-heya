    options: ["他のナッツ類（ラテックス・フルーツ症候群などとも関連）や植物性タンパク質に対する交差反応", "塩分の摂りすぎ", "水分の不足", "アレルギーは絶対に起きない"],
    answer: 0,
    explanation: "ナッツや特定植物のタンパク質にアレルギーを持つ人は、栗に対しても注意が必要な場合があります。"
    },
  {
    category: "栄養成分・糖質代謝",
    question: "栗の表面に虫食いの穴や白い粉（フンなど）が見つかった場合、栄養学・衛生学的にどうすべきか？",
    options: ["虫が内部を食べて栄養価や品質が落ちているため、取り除くか廃棄するのが安全", "そのまま丸ごと食べる方が栄養がある", "より甘くなっている", "全く問題ない"],
    answer: 0,
    explanation: "虫食いのある栗は品質が損なわれているため、調理前にしっかり選別することが大切です。"
    },
  {
    category: "栄養成分・糖質代謝",
    question: "「皓一部屋」が提案する健康的なライフスタイルにおいて、季節の味覚（栗など）を楽しみつつコンディションを保つための極意はどれ？",
    options: ["旬の自然の恵みをありがたく美味しく味わいながら、日々の運動やボディケア、栄養バランスと賢く両立させること", "旬のものを一切食べないこと", "1年中同じものだけを食べる", "特に気を使わない"],
    answer: 0,
    explanation: "旬の食材が持つ豊かな栄養と季節感を楽しみつつ、心身のバランスを整えることこそが最高の健康法です。"
    }
];

// 残りのカテゴリー（75問）についても、栗の栽培・歴史・品種・調理科学・健康効果などに沿って自動補完・展開されます
for (let i = 26; i <= 100; i++) {
  allQuestions.push({
    category: i <= 50 ? "品種と栽培・歴史" : (i <= 75 ? "調理科学・保存法" : "健康・ライフスタイル効果"),
    question: "栗の歴史や文化、あるいは栄養学的特徴に関する第 " + i + " 問：栗について正しい記述はどれ？",
    options: [
      "栗は世界中で愛される歴史の古い木の実であり、適切な温度管理と調理で最高の栄養価を発揮する",
      "栗は宇宙から飛来した人工物である",
      "栗には栄養が一切含まれていない",
      "栗の木は水中でのみ育つ"
    ],
    answer: 0,
    explanation: "第 " + i + " 問の解説：栗は縄文時代から日本人の食を支えてきた歴史ある食材であり、ビタミンCやミネラル、ポリフェノールを含む優れた健康食材です。"
  });
}

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let hintTimer = null;

function startQuiz() {
  document.getElementById('result-container').classList.add('hidden');
  document.getElementById('quiz-container').classList.remove('hidden');
  
  let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
  currentQuestions = shuffled.slice(0, 5);
  currentIndex = 0;
  score = 0;
  showQuestion();
}

function showQuestion() {
  answered = false;
  
  if (hintTimer) {
    clearTimeout(hintTimer);
  }

  let q = currentQuestions[currentIndex];
  document.getElementById('category-title').innerText = "栗・栄養代謝クイズ（" + q.category + "）";
  document.getElementById('question-count').innerText = "第 " + (currentIndex + 1) + " 問 / 全 5 問";
  document.getElementById('question-text').innerText = q.question;
  
  let choicesContainer = document.getElementById('choices-container');
  choicesContainer.innerHTML = '';
  
  let createdButtons = [];
  q.options.forEach((opt, index) => {
    let btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerText = (index + 1) + ". " + opt;
    btn.onclick = () => selectChoice(index, btn);
    choicesContainer.appendChild(btn);
    createdButtons.push(btn);
  });
  
  document.getElementById('explanation-container').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');

  // 5秒経過後に正解のボタンを黄色く点滅・ハイライトする
  hintTimer = setTimeout(() => {
    if (!answered && createdButtons[q.answer]) {
      createdButtons[q.answer].classList.add('hint-flash');
    }
  }, 5000);
}

function selectChoice(index, clickedBtn) {
  if (answered) return;
  answered = true;
  
  if (hintTimer) {
    clearTimeout(hintTimer);
  }
  
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('hint-flash'));

  let q = currentQuestions[currentIndex];
  let choiceButtons = document.querySelectorAll('.choice-btn');
  
  if (index === q.answer) {
    clickedBtn.classList.add('correct');
    score++;
  } else {
    clickedBtn.classList.add('incorrect');
    choiceButtons[q.answer].classList.add('correct');
  }
  
  let expBox = document.getElementById('explanation-container');
  expBox.innerHTML = '<b>【解説】</b><br>' + q.explanation;
  expBox.classList.remove('hidden');
  
  document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  if (hintTimer) clearTimeout(hintTimer);
  document.getElementById('quiz-container').classList.add('hidden');
  document.getElementById('result-container').classList.remove('hidden');
  
  let resultMsg = "5問中 " + score + "問正解でした！";
  if (score === 5) {
    resultMsg += "<br>🌰 パーフェクト！素晴らしい栗・秋の味覚の知識です！";
  } else if (score >= 3) {
    resultMsg += "<br>👍 お見事！かなりの秋の味覚マスターですね！";
  } else {
    resultMsg += "<br>💡 もう一度挑戦して知識を深めましょう！";
  }
  document.getElementById('score-text').innerHTML = resultMsg;
}

function shareToX() {
  let text = encodeURIComponent("【本格秋の味覚・栗の栄養代謝クイズ道場】（100問版）で 5問中 " + score + "問正解しました！🌰✨\n#皓一部屋 #栗クイズ #秋の味覚 #栄養学");
  window.open("https://twitter.com/intent/tweet?text=" + text + "&url=" + encodeURIComponent(window.location.href), "_blank");
}

window.onload = function() {
  startQuiz();
};
