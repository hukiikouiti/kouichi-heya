  currentQuestions = shuffled.slice(0, 5);
  currentIndex = 0;
  score = 0;
  showQuestion();
}

function showQuestion() {
  answered = false;
  if (hintTimer) clearTimeout(hintTimer);

  let q = currentQuestions[currentIndex];
  document.getElementById('category-title').innerText = "下肢の骨格解剖学クイズ（" + q.category + "）";
  document.getElementById('question-count').innerText = "第 " + (currentIndex + 1) + " 問 / 全 5 問";
  document.getElementById('question-text').innerText = q.question;
  
  let choicesContainer = document.getElementById('choices-container');
  choicesContainer.innerHTML = '';
  
  let createdButtons = [];
  q.options.forEach((opt, index) => {
    let btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerText = (index + 1) + ". " + opt;
    btn.onclick = () => selectChoice(index, btn);
    choicesContainer.appendChild(btn);
    createdButtons.push(btn);
  });
  
  document.getElementById('explanation-container').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');

  hintTimer = setTimeout(() => {
    if (!answered && createdButtons[q.answer]) {
      createdButtons[q.answer].classList.add('hint-flash');
    }
  }, 5000);
}

function selectChoice(index, clickedBtn) {
  if (answered) return;
  answered = true;
  if (hintTimer) clearTimeout(hintTimer);
  
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('hint-flash'));

  let q = currentQuestions[currentIndex];
  let choiceButtons = document.querySelectorAll('.choice-btn');
  
  if (index === q.answer) {
    clickedBtn.classList.add('correct');
    score++;
  } else {
    clickedBtn.classList.add('incorrect');
    choiceButtons[q.answer].classList.add('correct');
  }
  
  let expBox = document.getElementById('explanation-container');
  expBox.innerHTML = '<b>【解説】</b><br>' + q.explanation;
  expBox.classList.remove('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  if (hintTimer) clearTimeout(hintTimer);
  document.getElementById('quiz-container').classList.add('hidden');
  document.getElementById('result-container').classList.remove('hidden');
  
  let resultMsg = "5問中 " + score + "問正解でした！";
  if (score === 5) {
    resultMsg += "<br>🎉 パーフェクト！素晴らしい下肢骨格の知識です！";
  } else if (score >= 3) {
    resultMsg += "<br>👍 お見事！かなりの解剖学マスターですね！";
  } else {
    resultMsg += "<br>💡 もう一度挑戦して知識を深めましょう！";
  }
  document.getElementById('score-text').innerHTML = resultMsg;

  if (window.dataLayer) {
      window.dataLayer.push({'event': 'quiz_finish', 'score': score});
  }
}

function restartQuiz() {
  startQuiz();
}

function shareToX() {
  let text = encodeURIComponent("【下肢の骨格解剖学クイズ道場】で 5問中 " + score + "問正解しました！🦴✨\n#皓一部屋 #解剖学クイズ");
  window.open("https://twitter.com/intent/tweet?text=" + text + "&url=" + encodeURIComponent(window.location.href), "_blank");
}

window.onload = function() {
  startQuiz();
};
</script>
