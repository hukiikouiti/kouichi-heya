<!DOCTYPE html>
<html lang="ja">
<head>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NJH9D2DZ');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指の名前記憶ゲーム - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #2c3e50;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-box {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
            margin: 10px 0;
        }
        /* 自作画像ステージの設定 */
        .image-stage {
            width: 100%;
            height: 280px;
            background-color: #ffffff;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: contain;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            background-image: url('pa-hando.png');
        }
        /* 各指のタップボタン */
        .spot-btn {
            position: absolute;
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 3px solid #7a6b60;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .spot-btn.active-target {
            background-color: #fef08a !important;
            border-color: #eab308 !important;
            transform: translate(-50%, -50%) scale(1.25);
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.8);
            z-index: 20;
        }
        .spot-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        /* 写真の位置に合わせて指先にピタッと合わせるよう再調整した座標 */
        #btn-syoushi { top: 37%; left: 29%; } /* 小指 */
        #btn-kanshi  { top: 22%; left: 39%; } /* 薬指 */
        #btn-cyuushi { top: 16%; left: 49%; } /* 中指 */
        #btn-jishi   { top: 21%; left: 59%; } /* 人差し指 */
        #btn-boshi   { top: 40%; left: 73%; } /* 親指 */

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 30px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .start-btn {
            background-color: #8e44ad;
            color: #fff;
        }
        .share-btn {
            background-color: #000000;
            color: #fff;
            margin-top: 12px;
        }
        .reserve-btn {
            background-color: #2ecc71;
            color: #fff;
            margin-top: 8px;
        }
        .hidden {
            display: none !important;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #3498db;
            font-size: 0.85rem;
            text-decoration: none;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>✋ 指の名前記憶ゲーム</h1>
    <p>光る指を素早くタップしてね！（星野青龍の音声が出るよ）</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <button class="btn start-btn" onclick="startGame()">スタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-box">残り <span id="timer">20</span> 秒</div>
        <div class="image-stage">
            <button class="spot-btn" id="btn-syoushi" data-finger="syoushi" onclick="tapFinger('syoushi')"></button>
            <button class="spot-btn" id="btn-kanshi" data-finger="kanshi" onclick="tapFinger('kanshi')"></button>
            <button class="spot-btn" id="btn-cyuushi" data-finger="cyuushi" onclick="tapFinger('cyuushi')"></button>
            <button class="spot-btn" id="btn-jishi" data-finger="jishi" onclick="tapFinger('jishi')"></button>
            <button class="spot-btn" id="btn-boshi" data-finger="boshi" onclick="tapFinger('boshi')"></button>
        </div>
        <p>正解数: <span id="score" style="font-weight:bold; font-size:1.1rem; color:#8e44ad;">0</span> 回</p>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 style="color: #27ae60; font-size: 1.2rem;">✨ 指の名前記憶ゲーム完了！</h2>
        <p id="result-message"></p>
        <a id="share-link" href="#" target="_blank" rel="noopener noreferrer" class="btn share-btn">𝕏 で結果をシェアする</a>
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" rel="noopener noreferrer" class="btn reserve-btn">📅 予約する</a>
        <a href="javascript:void(0)" onclick="resetGame()" style="display:block; margin-top:12px; color:#888; font-size:0.8rem; text-decoration:none;">もう一度あそぶ</a>
    </div>

    <a href="game.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<!-- 音声ファイルの読み込み -->
<audio id="sound-boshi" src="boshi.wav" preload="auto"></audio>
<audio id="sound-jishi" src="jishi.wav" preload="auto"></audio>
<audio id="sound-cyuushi" src="cyuushi.wav" preload="auto"></audio>
<audio id="sound-kanshi" src="kanshi.wav" preload="auto"></audio>
<audio id="sound-syoushi" src="syoushi.wav" preload="auto"></audio>

<script>
    const fingers = ['boshi', 'jishi', 'cyuushi', 'kanshi', 'syoushi'];
    let currentTarget = null;
    let score = 0;
    let timeLeft = 20;
    let timerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        score = 0;
        timeLeft = 20;
        document.getElementById('score').innerText = score;
        document.getElementById('timer').innerText = timeLeft;

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'yubi_game'});
        }

        nextTarget();

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function nextTarget() {
        if (!isPlaying) return;
        
        fingers.forEach(f => {
            document.getElementById('btn-' + f).classList.remove('active-target');
        });

        let next;
        do {
            next = fingers[Math.floor(Math.random() * fingers.length)];
        } while (next === currentTarget);

        currentTarget = next;
        document.getElementById('btn-' + currentTarget).classList.add('active-target');
    }

    function tapFinger(fingerName) {
        if (!isPlaying) return;

        if (fingerName === currentTarget) {
            score++;
            document.getElementById('score').innerText = score;
            playSound(fingerName);

            if (window.dataLayer) {
                window.dataLayer.push({
                    'event': 'finger_correct',
                    'finger_type': fingerName,
                    'current_score': score
                });
            }

            nextTarget();
        }
    }

    function playSound(fingerName) {
        const audio = document.getElementById('sound-' + fingerName);
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("音声再生エラー:", e));
        }
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);

        fingers.forEach(f => {
            document.getElementById('btn-' + f).classList.remove('active-target');
        });

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        var judge = score <= 15 ? "【指の名前お疲れモード】" : score <= 30 ? "【スッキリ指の名前記憶】" : "【指の名前記憶マスター】";
        document.getElementById('result-message').innerHTML = '20秒で <b>' + score + ' 回</b> 正解しました！<br><span style="font-size:0.8rem; color:#8e44ad; font-weight:bold;">' + judge + '</span><br><br>星野青龍のボイスと指の名前記憶で頭もスッキリ！';

        var text = encodeURIComponent('指の名前記憶ゲームで ' + score + ' 回正解しました！\n判定：' + judge + '\n\n星野青龍のボイス付き指の記憶ゲームで癒やされよう！👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/') + '&hashtags=皓一部屋,名古屋マッサージ';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'yubi_game', 'score': score});
        }
    }

    function resetGame() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('game-start-screen').classList.remove('hidden');
        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');
        isPlaying = false;
    }
</script>

</body>
</html>
