    <meta charset="UTF-8">

    <title>ワカメサラダをもぐもぐ食べるゲーム - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #00838f;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #00acc1;
        }
        /* 海中ステージ（綺麗なブルー系グラデーション） */
        .wakame-stage {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #00acc1 100%);
            border: 3px solid #00838f;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }
        /* 背景にうっすら気泡を演出するドットパターン */
        .wakame-stage::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
            pointer-events: none;
        }
        /* 落ちてくるオブジェクト（ワカメ・タコなど） */
        .falling-item {
            position: absolute;
            width: 50px;
            height: 50px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s linear;
        }
        /* ゲットやミスのポップアップ文字 */
        .popup-msg {
            position: absolute;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
            z-index: 10;
        }
        .popup-plus { color: #fff; background: rgba(0, 172, 193, 0.9); border: 1px solid #ffcc00; }
        .popup-miss { color: #fff; background: rgba(192, 57, 43, 0.9); border: 1px solid #ff9999; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-35px) scale(1.1); }
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .start-btn {
            background-color: #00acc1;
            color: #fff;
            border-radius: 30px;
        }
        .share-btn {
            background-color: #000000;
            color: #fff;
            margin-top: 10px;
        }
        .line-btn {
            background: linear-gradient(135deg, #06c755, #05b34c);
            color: #fff;
            margin-top: 10px;
        }
        .reserve-btn {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: #fff;
            margin-top: 10px;
        }
        .hidden {
            display: none !important;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #3498db;
            font-size: 0.85rem;
            text-decoration: none;
        }
    </style>
</head>

<div class="game-card">
    <h1>🥗 ワカメサラダを食べる男</h1>
    <p>上から落ちてくる「ワカメ（🌿 / 🥗）」をタップしてモグモグ食べよう！「タコ（🐙）」をタップするとミスになるので注意！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">😋🥗</div>
        <button class="btn start-btn" onclick="startGame()">ゲームスタート！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">20</span>秒</div>
            <div>食べた量: <span id="score-count">0</span>皿</div>
        </div>
        
        <!-- 海中ステージ -->
        <div class="wakame-stage" id="wakame-stage"></div>
        <p style="font-size:0.8rem; color:#888;">ワカメを素早くタップして食べまくれ！</p>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #00838f; font-size: 1.2rem;">✨ もぐもぐタイム終了！</h2>
        <p id="result-message"></p>
        <a id="share-link" href="#" target="_blank" rel="noopener noreferrer" class="btn share-btn">𝕏 で結果をシェアする</a>
        <a href="https://lin.ee/7Lb96Ev" target="_blank" rel="noopener noreferrer" class="btn line-btn">🟢 LINEお友達追加</a>
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" rel="noopener noreferrer" class="btn reserve-btn">📅 予約する（空き状況確認・ご予約）</a>
        <a href="javascript:void(0)" onclick="resetGame()" style="display:block; margin-top:12px; color:#888; font-size:0.8rem; text-decoration:none;">もう一度あそぶ</a>
    </div>

    <a href="game.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<script>
    let score = 0;
    let timeLeft = 20;
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        score = 0;
        timeLeft = 20;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('score-count').innerText = score;

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'wakame_game'});
        }

        // 制限時間タイマー（20秒）
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);

        // ワカメやタコを降らせるタイマー
        spawnerInterval = setInterval(spawnItem, 550);
    }

    function spawnItem() {
        if (!isPlaying) return;
        const stage = document.getElementById('wakame-stage');
        
        const item = document.createElement('div');
        item.className = 'falling-item';

        // 75%の確率でワカメ（🌿または🥗）、25%の確率でミスオブジェクト（🐙）
        const rand = Math.random();
        let itemType = 'wakame';
        if (rand < 0.5) {
            item.innerHTML = '🌿';
            itemType = 'wakame';
        } else if (rand < 0.75) {
            item.innerHTML = '🥗';
            itemType = 'wakame';
