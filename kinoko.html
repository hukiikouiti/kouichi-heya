<!DOCTYPE html>
<html lang="ja">
<head>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-NJH9D2DZ');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キノコ抜き道場 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #8b5a2b;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #8b5a2b;
        }
        /* ゲームステージ */
        .game-stage {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #f4ecd8 0%, #e6d5b8 100%);
            border: 3px solid #8b5a2b;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }
        /* 生えてくるキノコ */
        .kinoko-item {
            position: absolute;
            width: 60px;
            height: 60px;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .kinoko-item:active {
            transform: scale(0.85);
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .start-btn {
            background-color: #8b5a2b;
            color: #fff;
            border-radius: 30px;
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🍄 キノコ抜き道場</h1>
    <p>制限時間20秒！生えてくる椎茸を素早くスポスポ収穫しまくれ！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;">🍄✨</div>
        <button class="btn start-btn" onclick="startGame()">道場に入門する！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">20.0</span>秒</div>
            <div>収穫数: <span id="score-count">0</span>本</div>
        </div>
        
        <div class="game-stage" id="game-stage"></div>
        <p style="font-size:0.8rem; color:#888;">ひょっこり生えてくるキノコをタップ！</p>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #8b5a2b; font-size: 1.2rem;">✨ 修行終了！</h2>
        
        <div id="result-message" style="font-size: 1rem; margin: 15px 0; color: #333; line-height: 1.6;"></div>

        <a href="https://lin.ee/7Lb96Ev" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #06c755, #05b34c); color: #fff;">🟢 LINEお友達追加</a>
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #27ae60, #219653); color: #fff;">📅 予約する（空き状況確認・ご予約）</a>
        <a id="share-link" target="_blank" class="game-link-btn" style="background: #000; color: #fff; font-size: 0.95rem;">𝕏 で結果をシェアする</a>

        <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 12px; box-sizing: border-box;">
            <button onclick="startGame()" style="background: #8b5a2b; color: #fff; flex: 1; padding: 14px 10px; border-radius: 14px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.95rem;">もう一度遊ぶ</button>
            <a href="game.html" style="background: #95a5a6; color: #fff; flex: 1; padding: 14px 10px; border-radius: 14px; font-weight: bold; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.06); font-size: 0.95rem;">ゲーム選択に戻る</a>
        </div>

        <a href="index.html" class="game-link-btn" style="background: #7f8c8d; color: #fff; font-size: 0.95rem; margin-bottom: 0;">🏠 トップに戻る</a>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 20.0;
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        score = 0;
        timeLeft = 20.0;
        document.getElementById('timer').innerText = '20.0';
        document.getElementById('score-count').innerText = score;

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'kinoko_game'});
        }

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);
        }, 100);

        spawnerInterval = setInterval(spawnKinoko, 600);
    }

    function spawnKinoko() {
        if (!isPlaying) return;
        const stage = document.getElementById('game-stage');
        
        const kinoko = document.createElement('div');
        kinoko.className = 'kinoko-item';
        kinoko.innerHTML = '🍄';

        const maxX = stage.clientWidth - 60;
        const maxY = stage.clientHeight - 60;
        const randomX = Math.floor(Math.random() * Math.max(0, maxX));
        const randomY = Math.floor(Math.random() * Math.max(0, maxY));

        kinoko.style.left = randomX + 'px';
        kinoko.style.top = randomY + 'px';

        // 一定時間で消える
        const disappearTimer = setTimeout(() => {
            if (kinoko.parentNode) {
                kinoko.remove();
            }
        }, 1200);

        kinoko.onmousedown = kinoko.ontouchstart = (e) => {
            e.preventDefault();
            if (!isPlaying) return;

            clearTimeout(disappearTimer);
            score++;
            if (navigator.vibrate) navigator.vibrate(30);

            document.getElementById('score-count').innerText = score;
            kinoko.remove();
        };

        stage.appendChild(kinoko);
    }

    function clearItems() {
        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        clearInterval(spawnerInterval);
        clearItems();

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100]);
        }

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let judge = "";
        if (score >= 35) {
            judge = "【伝説の椎茸マスター大名人】";
        } else if (score >= 25) {
            judge = "【キノコ狩り上級者】";
        } else if (score >= 15) {
            judge = "【見習いシイタケ収穫人】";
        } else {
            judge = "【原木を見守る人】";
        }

        document.getElementById('result-message').innerHTML = '<div style="font-size:2.5rem; margin:5px 0;">🍄🏆</div>収穫数： <b>' + score + ' 本</b><br><span style="font-size:0.8rem; color:#8b5a2b; font-weight:bold;">' + judge + '</span><br><br>キノコ抜き道場での修行完了！';

        var text = encodeURIComponent('キノコ抜き道場で ' + score + '本 の椎茸を収穫しました！\n称号：' + judge + '\n\nスポスポ抜ける爽快感、あなたも道場に入門する？👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/kinoko.html') + '&hashtags=皓一部屋,キノコ抜き道場,健康エンタメ,名古屋マッサージ';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'kinoko_game', 'score': score});
        }
    }
</script>

</body>
</html>
