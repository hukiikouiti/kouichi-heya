<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>キノコ抜き道場 | 皓一部屋</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f7f9fc;
    color: #333;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }
  .screen {
    background: #ffffff;
    padding: 25px 20px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    max-width: 480px;
    width: 90%;
    box-sizing: border-box;
    text-align: center;
  }
  h1 { font-size: 1.2rem; color: #8b5a2b; margin-top: 0; }
  p { font-size: 0.85rem; color: #666; line-height: 1.5; }
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #8b5a2b, #654321);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    margin-top: 15px;
    text-decoration: none;
    box-sizing: border-box;
    text-align: center;
  }
  .back-link {
    display: inline-block;
    margin-top: 15px;
    color: #3498db;
    font-size: 0.85rem;
    text-decoration: none;
  }
  .hidden { display: none !important; }

  /* 茶色地面のゲーム画面 */
  #game-canvas-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 400px;
    background: linear-gradient(180deg, #8d6e63 0%, #5d4037 100%);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    border: 2px solid #d7ccc8;
    touch-action: none;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    padding: 10px 20px;
    font-weight: bold;
    font-size: 1rem;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .kinoko-wrapper {
    position: absolute;
    width: 65px;
    height: 65px;
    background: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    transform: translate(-50%, -50%) scale(0);
    animation: popUp 0.3s forwards;
    border: 3px solid #ffccbc;
    -webkit-tap-highlight-color: transparent;
  }
  .kinoko-item {
    font-size: 2.2rem;
  }
  @keyframes popUp {
    to { transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="screen" id="start-screen">
  <h1>🍄 キノコ抜き道場</h1>
  <p>茶色の地面から生えてくる椎茸（🍄）を白いボタンごとスポスポ収穫しよう！</p>
  <div style="font-size: 3rem; margin: 10px 0;">🍄</div>
  <button id="start-btn" class="btn">ゲームスタート！</button>
  <br>
  <a href="game.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<div class="screen hidden" id="game-screen" style="padding: 10px;">
  <div class="hud">
    <div id="timer-text">残り時間: 20秒</div>
    <div id="score-text">収穫数: 0個</div>
  </div>
  <div id="game-canvas-container"></div>
</div>

<div class="screen hidden" id="result-screen">
  <h1>🎉 収穫結果発表！</h1>
  <p id="result-score" style="font-size: 1.2rem; font-weight: bold; color: #8b5a2b; margin: 20px 0;"></p>
  <button class="btn" onclick="startGame()">もう一度挑戦する</button>
  <button class="btn" style="background: #000; margin-top: 10px;" onclick="shareToX()">Xで結果をシェアする</button>
  <!-- LINEお友達追加ボタン -->
  <a href="https://lin.ee/7Lb96Ev" target="_blank" class="btn" style="background: linear-gradient(135deg, #06c755, #05b34c); margin-top: 10px;">🟢 LINEお友達追加</a>
  <!-- 予約枠ボタン -->
  <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" class="btn" style="background: linear-gradient(135deg, #27ae60, #219653); margin-top: 10px;">📅 予約する（空き状況確認・ご予約）</a>
  <br>
  <a href="game.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<script>
let score = 0;
let timeLeft = 20;
let timerId = null;
let spawnerId = null;
let gameActive = false;

document.addEventListener('DOMContentLoaded', () => {
  const startBtn = document.getElementById('start-btn');
  if (startBtn) {
    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      startGame();
    });
  }
});

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  score = 0;
  timeLeft = 20;
  gameActive = true;
  document.getElementById('score-text').innerText = "収穫数: " + score + "個";
  document.getElementById('timer-text').innerText = "残り時間: " + timeLeft + "秒";

  const container = document.getElementById('game-canvas-container');
  container.innerHTML = '';

  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer-text').innerText = "残り時間: " + timeLeft + "秒";
    if (timeLeft <= 0) endGame();
  }, 1000);

  if (spawnerId) clearInterval(spawnerId);
  spawnerId = setInterval(() => {
    if (gameActive) spawnKinoko();
  }, 700);
}

function spawnKinoko() {
  const container = document.getElementById('game-canvas-container');
  
  const wrapper = document.createElement('div');
  wrapper.className = 'kinoko-wrapper';

  const item = document.createElement('div');
  item.className = 'kinoko-item';
  item.innerText = '🍄';
  wrapper.appendChild(item);

  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  
  const randomX = Math.random() * (containerWidth - 90) + 45;
  const randomY = Math.random() * (containerHeight - 90) + 45;

  wrapper.style.left = randomX + 'px';
  wrapper.style.top = randomY + 'px';

  container.appendChild(wrapper);

  const disappearTimeout = setTimeout(() => {
    if (wrapper.parentNode) {
      wrapper.remove();
    }
  }, 1500);

  wrapper.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (!gameActive) return;

    if (navigator.vibrate) {
      navigator.vibrate(40);
    }

    clearTimeout(disappearTimeout);
    score++;
    item.innerText = '✨';
    wrapper.style.background = '#e8f5e9';
    setTimeout(() => wrapper.remove(), 150);
    document.getElementById('score-text').innerText = "収穫数: " + score + "個";
  });
}

function endGame() {
  gameActive = false;
  clearInterval(timerId);
  clearInterval(spawnerId);

  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('result-score').innerText = "合計収穫数: " + score + "個！";
}

function shareToX() {
  const text = encodeURIComponent("【キノコ抜き道場】で椎茸を " + score + "個収穫しました！🍄✨\n#皓一部屋 #リフレッシュゲーム");
  window.open("https://twitter.com/intent/tweet?text=" + text + "&url=" + encodeURIComponent(window.location.href), "_blank");
}
</script>

</body>
</html>
