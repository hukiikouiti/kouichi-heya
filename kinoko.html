            justify-content: space-around;

        }
        /* ゲームステージ：茶色系 */
        .game-stage {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #795548 0%, #5d4037 100%);
            border: 3px solid #3e2723;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }
        /* 生えてくるキノコ */
        .kinoko-item {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ffffff;
            border: 3px solid #d7ccc8;
            border-radius: 50%;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
        }
        .kinoko-item:active {
            transform: scale(0.85);
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

            background-color: #8b5a2b;
            color: #fff;
            border-radius: 30px;
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;

<script>
    let score = 0;
    let timeLeft = 20.0;
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        score = 0;
        timeLeft = 20.0;
        document.getElementById('timer').innerText = '20.0';
        document.getElementById('score-count').innerText = score;

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'kinoko_game'});
        }

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);
        }, 100);

        spawnerInterval = setInterval(spawnKinoko, 600);
    }

        kinoko.style.top = randomY + 'px';

            }
        }, 1200);
