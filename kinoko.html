<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>キノコ抜き道場 | 皓一部屋</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f7f9fc;
    color: #333;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .screen {
    background: #ffffff;
    padding: 25px 20px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    max-width: 480px;
    width: 90%;
    box-sizing: border-box;
    text-align: center;
  }
  h1 { font-size: 1.2rem; color: #8b5a2b; margin-top: 0; }
  p { font-size: 0.85rem; color: #666; line-height: 1.5; }
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #8b5a2b, #654321);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    margin-top: 15px;
  }
  .back-link {
    display: inline-block;
    margin-top: 15px;
    color: #3498db;
    font-size: 0.85rem;
    text-decoration: none;
  }
  .hidden { display: none !important; }

  /* ゲームプレイ画面のスタイル */
  #game-canvas-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 400px;
    background: #f1f8e9;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    border: 2px solid #dcedc8;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    padding: 10px 20px;
    font-weight: bold;
    font-size: 1rem;
    color: #558b2f;
  }
  .kinoko-item {
    position: absolute;
    font-size: 2.8rem;
    cursor: pointer;
    transform: translate(-50%, -50%) scale(0);
    animation: popUp 0.3s forwards;
  }
  @keyframes popUp {
    to { transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<!-- スタート画面 -->
<div class="screen" id="start-screen">
  <h1>🍄 キノコ抜き道場</h1>
  <p>次々生えてくる椎茸（🍄）を素早くタップしてスポスポ収穫しよう！</p>
  <div style="font-size: 3rem; margin: 10px 0;">🍄</div>
  <button class="btn" onclick="startGame()">ゲームスタート！</button>
  <br>
  <a href="menu.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<!-- プレイ画面 -->
<div class="screen hidden" id="game-screen" style="padding: 10px;">
  <div class="hud">
    <div id="timer-text">残り時間: 20秒</div>
    <div id="score-text">収穫数: 0</div>
  </div>
  <div id="game-canvas-container"></div>
</div>

<!-- 結果画面 -->
<div class="screen hidden" id="result-screen">
  <h1>🎉 収穫結果発表！</h1>
  <p id="result-score" style="font-size: 1.2rem; font-weight: bold; color: #8b5a2b; margin: 20px 0;"></p>
  <button class="btn" onclick="startGame()">もう一度挑戦する</button>
  <button class="btn" style="background: #000; margin-top: 10px;" onclick="shareToX()">Xで結果をシェアする</button>
  <br>
  <a href="menu.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<script>
let score = 0;
let timeLeft = 20;
let timerId = null;
let spawnerId = null;
let gameActive = false;

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  score = 0;
  timeLeft = 20;
  gameActive = true;
  document.getElementById('score-text').innerText = "収穫数: " + score;
  document.getElementById('timer-text').innerText = "残り時間: " + timeLeft + "秒";

  const container = document.getElementById('game-canvas-container');
  container.innerHTML = '';

  // タイマー開始
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer-text').innerText = "残り時間: " + timeLeft + "秒";
    if (timeLeft <= 0) {
      endGame();
    }
  }, 1000);

  // キノコを生やすタイマー
  if (spawnerId) clearInterval(spawnerId);
  spawnerId = setInterval(() => {
    if (gameActive) spawnKinoko();
  }, 500);
}

function spawnKinoko() {
  const container = document.getElementById('game-canvas-container');
  const item = document.createElement('div');
  item.className = 'kinoko-item';
  item.innerText = '🍄';

  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  
  const randomX = Math.random() * (containerWidth - 60) + 30;
  const randomY = Math.random() * (containerHeight - 60) + 30;

  item.style.left = randomX + 'px';
  item.style.top = randomY + 'px';

  container.appendChild(item);

  // 一定時間（1.2秒）以内にタップしないと消える
  const disappearTimeout = setTimeout(() => {
    if (item.parentNode) {
      item.remove();
    }
  }, 1200);

  // タップしたときの処理
  item.onclick = function(e) {
    e.stopPropagation();
    if (!gameActive) return;

    clearTimeout(disappearTimeout);
    score++;
    item.innerText = '✨';
    setTimeout(() => item.remove(), 150);
    document.getElementById('score-text').innerText = "収穫数: " + score;
  };
}

function endGame() {
  gameActive = false;
  clearInterval(timerId);
  clearInterval(spawnerId);

  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('result-score').innerText = "合計収穫数: " + score + "個！";
}

function shareToX() {
  const text = encodeURIComponent("【キノコ抜き道場】で椎茸を " + score + "個収穫しました！🍄✨\n#皓一部屋 #リフレッシュゲーム");
  window.open("https://twitter.com/intent/tweet?text=" + text, "_blank");
}
</script>

</body>
</html>
