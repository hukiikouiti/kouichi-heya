<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>松茸抜き道場 - 皓一部屋</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: #8b5a2b;
        }
        p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 12px;
        }
        .timer-score {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #8b5a2b;
        }
        /* ゲームステージ：松茸の雰囲気（秋の山・大地をイメージした深めのブラウン） */
        .game-stage {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #6d4c41 0%, #4e342e 100%);
            border: 3px solid #3e2723;
            border-radius: 16px;
            position: relative;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
        }
        /* 生えてくる松茸画像アイテム */
        .matsutake-item {
            position: absolute;
            width: 65px;
            height: 65px;
            background: #ffffff;
            border: 2px solid #d7ccc8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            overflow: hidden;
            padding: 4px;
            box-sizing: border-box;
        }
        .matsutake-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        .matsutake-item:active {
            transform: scale(0.85);
        }
        
        /* スポッ！の吹き出しアニメーション */
        @keyframes popUpText {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -45px) scale(1.3); }
        }
        .pop-popup {
            position: absolute;
            color: #ffeb3b;
            font-weight: 900;
            font-size: 1.1rem;
            text-shadow: 2px 2px 0 #d32f2f, -2px -2px 0 #d32f2f, 2px -2px 0 #d32f2f, -2px 2px 0 #d32f2f;
            pointer-events: none;
            animation: popUpText 0.4s ease-out forwards;
            z-index: 10;
            white-space: nowrap;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px 0;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }
        .start-btn {
            background-color: #8b5a2b;
            color: #fff;
            border-radius: 30px;
        }
        .game-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            box-sizing: border-box;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="game-card">
    <h1>🌲 松茸抜き道場</h1>
    <p>制限時間20秒！生えてくる高級松茸を素早くスポスポ収穫しまくれ！</p>

    <!-- スタート画面 -->
    <div id="game-start-screen">
        <div style="font-size: 3.5rem; margin: 15px 0;"><img src="松茸.png" alt="松茸" style="width: 80px; height: 80px; object-fit: contain; vertical-align: middle;"> ✨</div>
        <button class="btn start-btn" onclick="startGame()">道場に入門する！</button>
    </div>

    <!-- プレイ画面 -->
    <div id="game-play-screen" class="hidden">
        <div class="timer-score">
            <div>残り時間: <span id="timer">20.0</span>秒</div>
            <div>収穫数: <span id="score-count">0</span>本</div>
        </div>
        
        <div class="game-stage" id="game-stage"></div>
        <p style="font-size:0.8rem; color:#ccc;">ひょっこり生えてくる松茸をタップ！</p>
    </div>

    <!-- 結果画面 -->
    <div id="game-result-screen" class="hidden">
        <h2 id="result-title" style="color: #8b5a2b; font-size: 1.2rem;">✨ 修行終了！</h2>
        
        <!-- 結果メッセージを表示するエリア -->
        <div id="result-message" style="font-size: 0.9rem; margin: 15px 0; color: #333; line-height: 1.6; text-align: left; background: #efebe9; padding: 12px; border-radius: 10px; border-left: 5px solid #8b5a2b;"></div>

        <!-- 1列目：LINEお友達追加 -->
        <a href="https://lin.ee/7Lb96Ev" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #06c755, #05b34c); color: #fff;">🟢 LINEお友達追加</a>

        <!-- 2列目：予約する -->
        <a href="https://calendar.app.google/H6ANVr4xboHacg9K9" target="_blank" class="game-link-btn" style="background: linear-gradient(135deg, #27ae60, #219653); color: #fff;">📅 予約する（空き状況確認・ご予約）</a>

        <!-- 3列目：Xで結果をシェア -->
        <a id="share-link" href="#" target="_blank" class="game-link-btn" style="background: #000; color: #fff; text-align: center;">𝕏 で結果をシェアする</a>

        <!-- ボタンを格納するエリア -->
        <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;">

            <!-- 1段目：「もう一度あそぶ」＆「クイズ選択に戻る」 -->
            <div style="display: flex; gap: 8px; width: 100%;">
                <button onclick="startGame()" style="flex: 1; padding: 12px 5px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-sizing: border-box;">
                    もう一度あそぶ
                </button>
                <a href="kuizu.html" style="flex: 1; display: block; padding: 12px 5px; background: #7f8c8d; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    クイズ選択に戻る
                </a>
            </div>

            <!-- 2段目：「ゲーム選択に戻る」＆「トップに戻る」 -->
            <div style="display: flex; gap: 8px; width: 100%;">
                <a href="game.html" style="flex: 1; display: block; padding: 12px 5px; background: #e67e22; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    🎮 ゲーム選択に戻る
                </a>
                <a href="index.html" style="flex: 1; display: block; padding: 12px 5px; background: #95a5a6; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; text-align: center; box-sizing: border-box; line-height: 1.4;">
                    🏠 トップに戻る
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    let score = 0;
    let timeLeft = 20.0;
    let timerInterval = null;
    let spawnerInterval = null;
    let isPlaying = false;
    let audioCtx = null;

    // タップ時のタイマー音（ポコッ・スポッという軽い効果音）を生成する関数
    function playPopSound() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            // 高い音から低い音へピッチを急降下させて「スポッ」感を出す
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        } catch (e) {
            // 音声再生がブロックされた場合などのエラー対策
        }
    }

    function startGame() {
        if (isPlaying) {
            clearInterval(timerInterval);
            clearInterval(spawnerInterval);
            isPlaying = false;
        }

        isPlaying = true;
        score = 0;
        timeLeft = 20.0;
        document.getElementById('timer').innerText = '20.0';
        document.getElementById('score-count').innerText = score;

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        clearItems();

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'matsutake_game'});
        }

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
            document.getElementById('timer').innerText = timeLeft.toFixed(1);
        }, 100);

        spawnerInterval = setInterval(spawnMatsutake, 600);
    }

    function spawnMatsutake() {
        if (!isPlaying) return;
        const stage = document.getElementById('game-stage');
        
        const item = document.createElement('div');
        item.className = 'matsutake-item';
        
        const img = document.createElement('img');
        img.src = '松茸.png';
        img.alt = '松茸';
        item.appendChild(img);

        const maxX = stage.clientWidth - 65;
        const maxY = stage.clientHeight - 65;
        const randomX = Math.floor(Math.random() * Math.max(0, maxX));
        const randomY = Math.floor(Math.random() * Math.max(0, maxY));

        item.style.left = randomX + 'px';
        item.style.top = randomY + 'px';

        const disappearTimer = setTimeout(() => {
            if (item.parentNode) {
                item.remove();
            }
        }, 1200);

        item.onmousedown = item.ontouchstart = (e) => {
            e.preventDefault();
            if (!isPlaying) return;

            clearTimeout(disappearTimer);
            score++;
            
            // 効果音を鳴らす
            playPopSound();
            
            // バイブレーション
            if (navigator.vibrate) navigator.vibrate(30);

            // 「スポッ！」の吹き出しを表示
            const pop = document.createElement('div');
            pop.className = 'pop-popup';
            pop.innerText = 'スポッ！';
            pop.style.left = (randomX + 32) + 'px';
            pop.style.top = (randomY + 10) + 'px';
            stage.appendChild(pop);
            setTimeout(() => pop.remove(), 400);

            document.getElementById('score-count').innerText = score;
            item.remove();
        };

        stage.appendChild(item);
    }

    function clearItems() {
        const stage = document.getElementById('game-stage');
        stage.innerHTML = '';
    }

    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);
        clearInterval(spawnerInterval);
        clearItems();

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100]);
        }

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let judge = "";
        if (score >= 35) {
            judge = "【伝説の松茸マスター大名人】";
        } else if (score >= 25) {
            judge = "【高級松茸ハンター】";
        } else if (score >= 15) {
            judge = "【見習いキノコ収穫人】";
        } else {
            judge = "【赤松を見守る人】";
        }

        document.getElementById('result-message').innerHTML = '<div style="font-size:2rem; margin:5px 0;">🌲🏆</div>収穫数： <b>' + score + ' 本</b><br><span style="font-size:0.85rem; color:#8b5a2b; font-weight:bold;">' + judge + '</span><br><br>松茸抜き道場での修行完了！';

        var text = encodeURIComponent('松茸抜き道場で ' + score + '本 の高級松茸を収穫しました！\n称号：' + judge + '\n\nスポスポ抜ける爽快感、あなたも道場に入門する？👇');
        document.getElementById('share-link').href = 'https://twitter.com/intent/tweet?text=' + text + '&url=' + encodeURIComponent('https://hukiikouiti.github.io/kouichi-heya/kinoko.html') + '&hashtags=皓一部屋,松茸抜き道場,健康エンタメ,名古屋マッサージ';

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_finish', 'game_name': 'matsutake_game', 'score': score});
        }
    }
</script>

</body>
</html>
