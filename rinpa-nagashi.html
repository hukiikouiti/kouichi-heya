<script>
    let score = 0;
    let timeLeft = 20;
    let timerInterval = null;
    let isPlaying = false;
    let lastScrapeTime = 0;
    let audioCtx = null;

    // JavaScriptによる電子音生成（Web Audio API）
    function playBeep(freq = 523.25, type = 'sine', duration = 0.06) {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    // イベントリスナーの登録
    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.addEventListener('click', startGame);
            startBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                startGame();
            });
        }

        const stage = document.getElementById('rinpa-stage');
        if (stage) {
            stage.addEventListener('mousemove', handleScrape);
            stage.addEventListener('touchmove', handleScrape);
            stage.addEventListener('click', handleScrape);
            stage.addEventListener('touchstart', handleScrape);
        }
    });

    function startGame() {
        if (isPlaying) return;
        isPlaying = true;
        score = 0;
        timeLeft = 20;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('gauge-bar').style.width = '0%';
        document.getElementById('phase-indicator').innerText = "👉 右足をマッサージ中！";

        document.getElementById('game-start-screen').classList.add('hidden');
        document.getElementById('game-play-screen').classList.remove('hidden');
        document.getElementById('game-result-screen').classList.add('hidden');

        playBeep(440, 'sine', 0.15);

        if (window.dataLayer) {
            window.dataLayer.push({'event': 'game_start', 'game_name': 'rinpa_nagashi_game'});
        }

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;

            // 10秒経過したタイミングで左足へ切り替え
            if (timeLeft === 10) {
                document.getElementById('phase-indicator').innerText = "👉 次は左足！しっかり流そう！";
                playBeep(659.25, 'triangle', 0.2); // 切り替え音
            }

            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function handleScrape(e) {
        if (!isPlaying) return;
        
        if (e && e.cancelable) {
            e.preventDefault();
        }

        const now = Date.now();
        if (now - lastScrapeTime < 40) return; // レート制限で軽快に
        lastScrapeTime = now;

        score++;
        playBeep(587.33 + (score % 5) * 30, 'sine', 0.05); // こするたびに軽快な音
        
        // 20秒間で約120回を上限の100%とするゲージ設計
        let percentage = Math.min((score / 120) * 100, 100);
        document.getElementById('gauge-bar').style.width = percentage + '%';

        if (score >= 120) {
            endGame(true);
        }
    }

    function endGame(isCompleted = false) {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerInterval);

        playBeep(880, 'sine', 0.3);

        if (navigator.vibrate) {
            navigator.vibrate([100, 50, 100, 50, 150]);
        }

        document.getElementById('game-play-screen').classList.add('hidden');
        document.getElementById('game-result-screen').classList.remove('hidden');

        let judge = "";
        if (score < 40) {
            judge = "【お疲れ溜まり気味モード】";
        } else if (score < 80) {
            judge = "【すっきり軽やかモード】";
        } else if (score < 120) {
            judge = "【むくみ解消バッチリ上級者】";
        } else {
            judge = "【極上のリフレッシュ・マスター✨】";
        }

        document.getElementById('result-title').innerText = isCompleted ? "✨ 完璧なリンパ流し達成！" : "👏 お疲れ様でした！";
        document.getElementById('result-message').innerHTML = 
            '20秒間で計 <b>' + score + ' 回</b> リンパを流しました！<br>' +
            '<span style="font-size:0.85rem; color:#27ae60; font-weight:bold;">' + judge + '</span><br><br>' +
            '
