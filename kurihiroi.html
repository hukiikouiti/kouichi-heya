<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>秋の栗拾いゲーム | 皓一部屋</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f7f9fc;
    color: #333;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .screen {
    background: #ffffff;
    padding: 25px 20px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    max-width: 480px;
    width: 90%;
    box-sizing: border-box;
    text-align: center;
  }
  h1 { font-size: 1.2rem; color: #d35400; margin-top: 0; }
  p { font-size: 0.85rem; color: #666; line-height: 1.5; }
  .btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #d35400, #a04000);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    margin-top: 15px;
    text-decoration: none;
    box-sizing: border-box;
  }
  .back-link {
    display: inline-block;
    margin-top: 15px;
    color: #3498db;
    font-size: 0.85rem;
    text-decoration: none;
  }
  .hidden { display: none !important; }

  /* 夕暮れ背景のゲーム画面 */
  #game-canvas-container {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 400px;
    background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 50%, #d35400 100%);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    border: 2px solid #ffccbc;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    padding: 10px 20px;
    font-weight: bold;
    font-size: 1rem;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }
  .falling-item {
    position: absolute;
    font-size: 2.5rem;
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: transform 0.1s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .falling-item:active {
    transform: translate(-50%, -50%) scale(1.2);
  }
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NJH9D2DZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="screen" id="start-screen">
  <h1>🌰 秋の栗拾いゲーム</h1>
  <p>空から降ってくる「栗（🌰）」をタップして集めよう！<br>「葉っぱ（🍃）」をタップするとミスになるので注意！</p>
  <div style="font-size: 3rem; margin: 10px 0;">🌰</div>
  <button class="btn" onclick="startGame()">ゲームスタート！</button>
  <br>
  <a href="menu.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<div class="screen hidden" id="game-screen" style="padding: 10px;">
  <div class="hud">
    <div id="timer-text">残り時間: 20秒</div>
    <div id="score-text">スコア: 0個</div>
  </div>
  <div id="game-canvas-container"></div>
</div>

<div class="screen hidden" id="result-screen">
  <h1>🎉 記録発表！</h1>
  <p id="result-score" style="font-size: 1.2rem; font-weight: bold; color: #d35400; margin: 20px 0;"></p>
  <button class="btn" onclick="startGame()">もう一度挑戦する</button>
  <button class="btn" style="background: #000; margin-top: 10px;" onclick="shareToX()">Xで結果をシェアする</button>
  <a href="https://toluch.jp/kouichihigashino" target="_blank" class="btn" style="background: linear-gradient(135deg, #27ae60, #219653); margin-top: 10px; text-align: center;">📅 予約枠（空き状況確認・ご予約）</a>
  <br>
  <a href="menu.html" class="back-link">🎮 ゲーム選択に戻る</a>
</div>

<script>
let score = 0;
let timeLeft = 20;
let timerId = null;
let spawnerId = null;
let gameActive = false;

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  score = 0;
  timeLeft = 20;
  gameActive = true;
  document.getElementById('score-text').innerText = "スコア: " + score + "個";
  document.getElementById('timer-text').innerText = "残り時間: " + timeLeft + "秒";

  const container = document.getElementById('game-canvas-container');
  container.innerHTML = '';

  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer-text').innerText = "残り時間: " + timeLeft + "秒";
    if (timeLeft <= 0) endGame();
  }, 1000);

  if (spawnerId) clearInterval(spawnerId);
  spawnerId = setInterval(() => {
    if (gameActive) spawnItem();
  }, 700);
}

function spawnItem() {
  const container = document.getElementById('game-canvas-container');
  const item = document.createElement('div');
  item.className = 'falling-item';

  const isChestnut = Math.random() < 0.75;
  item.innerText = isChestnut ? '🌰' : '🍃';

  const containerWidth = container.clientWidth;
  const randomX = Math.random() * (containerWidth - 60) + 30;
  item.style.left = randomX + 'px';
  item.style.top = '-30px';

  container.appendChild(item);

  let currentTop = -30;
  // スピードを少し遅く調整
  const fallSpeed = Math.random() * 1.2 + 1.2;

  const fallInterval = setInterval(() => {
    if (!gameActive) {
      clearInterval(fallInterval);
      item.remove();
      return;
    }
    currentTop += fallSpeed;
    item.style.top = currentTop + 'px';

    if (currentTop > container.clientHeight + 30) {
      clearInterval(fallInterval);
      item.remove();
    }
  }, 20);

  item.onclick = function(e) {
    e.stopPropagation();
    if (!gameActive) return;

    if (isChestnut) {
      score += 1; // 1個ずつカウント
      item.innerText = '✨';
      setTimeout(() => item.remove(), 100);
    } else {
      score = Math.max(0, score - 2); // 葉っぱは-2個分
      item.innerText = '❌';
      setTimeout(() => item.remove(), 100);
    }
    document.getElementById('score-text').innerText = "スコア: " + score + "個";
  };
}

function endGame() {
  gameActive = false;
  clearInterval(timerId);
  clearInterval(spawnerId);

  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('result-score').innerText = "獲得した栗: " + score + "個！";
}

function shareToX() {
  const text = encodeURIComponent("【秋の栗拾いゲーム】で栗を " + score + "個拾いました！🌰✨\n#皓一部屋 #リフレッシュゲーム");
  window.open("https://twitter.com/intent/tweet?text=" + text, "_blank");
}
</script>

</body>
</html>
